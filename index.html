<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Foodoala</title>
<meta name="theme-color" content="#00071a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#00071a; --bg2:#0a1330; --bg3:#121d42; --line:#1e2a55;
  --txt:#eef2ff; --txt2:#8fa0cf;
  --red:#EE1515; --yellow:#FFCB05; --green:#3ddc84;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Raleway',sans-serif;min-height:100%}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-weight:900;font-size:1.5rem;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px}
header h1 .fd{color:var(--red)}
header h1 .ol{color:var(--yellow)}
header h1 .ver{font-size:.62rem;font-weight:800;color:var(--txt2);letter-spacing:.5px}
header .logo{width:48px;height:48px;border-radius:12px;object-fit:cover;flex-shrink:0}
header .hspacer{flex:1}
header .gearBtn{background:var(--bg2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:11px;font-size:1.05rem;display:flex;align-items:center;justify-content:center;position:relative}
#syncDot{width:9px;height:9px;border-radius:50%;background:var(--txt2);position:absolute;top:-3px;right:-3px;border:2px solid var(--bg);transition:background .3s}
#syncDot.on{background:var(--green)}
#syncDot.busy{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.page{display:none;padding:0 16px 24px;max-width:760px;margin:0 auto}
.page.active{display:block}
h2{font-weight:900;font-size:1.1rem;margin:14px 0 10px;text-transform:uppercase;letter-spacing:1px}
h2 small{color:var(--txt2);font-weight:600;text-transform:none;letter-spacing:0}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
button{font-family:inherit;font-weight:800;border:none;border-radius:12px;cursor:pointer;font-size:.9rem}
.btn{background:var(--red);color:#fff;padding:11px 16px;width:100%;margin-top:8px}
.btn.sec{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
.btn.yel{background:var(--yellow);color:#00071a}
.btn.sm{width:auto;padding:8px 12px;font-size:.8rem}
input,select,textarea{font-family:inherit;background:var(--bg3);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:.95rem;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);border-color:transparent}
label{font-size:.75rem;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;display:block;margin:10px 0 4px}
/* NAV */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--txt2);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.65rem;font-weight:800;border-radius:0}
nav button .ni{font-size:1.3rem;line-height:1}
nav button.active{color:var(--yellow)}
/* SEMAINE */
.weeknav{display:flex;align-items:center;gap:8px;margin:12px 0}
.weeknav button{background:var(--bg3);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:10px;font-size:1rem}
.weeknav .wk{flex:1;text-align:center;font-weight:900}
.weeknav .wk small{display:block;color:var(--txt2);font-weight:600;font-size:.7rem}
.day{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.day.today{border-color:var(--yellow)}
.dayhead{padding:8px 14px;font-weight:900;font-size:.85rem;text-transform:uppercase;letter-spacing:1px;color:var(--yellow);background:var(--bg3)}
.meal{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.meal .mlbl{font-size:.7rem;font-weight:800;color:var(--txt2);width:38px;text-transform:uppercase}
.meal .msel{flex:1;background:none;border:none;color:var(--txt);text-align:left;font-weight:700;font-size:.9rem;padding:4px 0}
.meal .msel.empty{color:var(--txt2);font-weight:600;font-style:italic}
.meal .mx{background:none;color:var(--txt2);font-size:1rem;padding:4px 6px}
/* RECETTES */
.searchrow{display:flex;gap:8px;margin:12px 0}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{background:var(--bg3);border:1px solid var(--line);color:var(--txt2);padding:6px 12px;border-radius:20px;font-size:.75rem;font-weight:800;white-space:nowrap}
.chip.active{background:var(--yellow);color:#00071a;border-color:var(--yellow)}
.rcard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rcard .rn{font-weight:800}
.rcard .rm{font-size:.72rem;color:var(--txt2);font-weight:600;margin-top:2px}
.rcard .rcat{font-size:.65rem;font-weight:900;padding:3px 8px;border-radius:8px;background:var(--bg3);color:var(--yellow);text-transform:uppercase;white-space:nowrap}
/* FICHE RECETTE (detail) */
.rdHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.rdMeta{display:flex;gap:14px;color:var(--txt2);font-size:.78rem;font-weight:700;margin:6px 0 16px;flex-wrap:wrap}
.rdMeta b{color:var(--yellow)}
.rdSection h3{font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--yellow);margin:16px 0 8px}
.rdIng{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.rdIng .qn{color:var(--txt2);font-weight:700;white-space:nowrap;margin-left:10px}
.rdStep{display:flex;gap:12px;margin-bottom:14px}
.rdStep .num{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--red);color:#fff;font-weight:900;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.rdStep p{font-size:.9rem;line-height:1.45;padding-top:2px}
.inglist{margin:8px 0}
.ingrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.ingrow input.qte{width:64px}
.ingrow input.uni{width:70px}
.ingrow select{width:110px}
.ingrow .del{background:none;color:var(--red);font-size:1.1rem;padding:0 6px}
/* COURSES */
.rayon{margin-bottom:14px}
.rayon h3{font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--yellow);margin-bottom:6px}
.citem{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.citem .cbx{width:20px;height:20px;border-radius:6px;border:2px solid var(--txt2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.citem.done .cbx{background:var(--green);border-color:var(--green);color:#00071a}
.citem.done .cn{text-decoration:line-through;color:var(--txt2)}
.citem .cn{font-weight:700;flex:1;font-size:.9rem}
.citem .cq{font-size:.8rem;color:var(--txt2);font-weight:700}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.addrow button{width:auto;margin:0;padding:0 16px}
/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,7,26,.85);z-index:50;overflow-y:auto;padding:20px 14px}
.modal.open{display:block}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);max-width:560px;margin:0 auto;padding:18px}
.mbox h2{margin-top:0}
.mrow{display:flex;gap:8px}
.mrow>div{flex:1}
.picklist{max-height:55vh;overflow-y:auto}
.empty{color:var(--txt2);text-align:center;padding:30px 0;font-weight:600}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--yellow);color:#00071a;font-weight:900;padding:10px 18px;border-radius:12px;z-index:60;display:none;font-size:.85rem}
.vtag{text-align:center;color:var(--txt2);font-size:.7rem;font-weight:700;margin-top:18px}
</style>
</head>
<body>

<header>
  <img class="logo" src="icons/icon-192.png" alt="Foodoala">
  <h1><span class="fd">Food</span><span class="ol">oala</span><span class="ver">v<span id="verTag"></span></span></h1>
  <div class="hspacer"></div>
  <button class="gearBtn" onclick="openSettings()"><span id="syncDot"></span>⚙️</button>
</header>

<!-- SEMAINE -->
<div class="page active" id="p-semaine">
  <div class="weeknav">
    <button onclick="chWeek(-1)">‹</button>
    <div class="wk"><span id="wkLbl"></span><small id="wkDates"></small></div>
    <button onclick="chWeek(1)">›</button>
  </div>
  <div id="weekList"></div>
</div>

<!-- RECETTES -->
<div class="page" id="p-recettes">
  <div class="searchrow">
    <input id="rSearch" placeholder="Rechercher une recette…" oninput="renderRecettes()">
    <button class="btn yel sm" onclick="openRecipeForm()">＋ Nouvelle</button>
  </div>
  <div class="chiprow" id="catChips"></div>
  <div id="recList"></div>
</div>

<!-- COURSES -->
<div class="page" id="p-courses">
  <h2 style="display:flex;justify-content:space-between;align-items:center">Liste de courses <small id="cCount"></small></h2>
  <button class="btn" onclick="genCourses()">🛒 Générer depuis la semaine</button>
  <div class="addrow">
    <input id="cAdd" placeholder="Ajouter un article…" onkeydown="if(event.key==='Enter')addManual()">
    <button class="btn sec" onclick="addManual()">＋</button>
  </div>
  <div id="courseList" style="margin-top:14px"></div>
  <button class="btn sec" id="cClear" onclick="clearDone()" style="display:none">Retirer les articles cochés</button>
</div>

<!-- MODAL REGLAGES -->
<div class="modal" id="mSettings" onclick="if(event.target===this)closeSettings()">
  <div class="mbox">
    <h2>Réglages</h2>
    <div class="card">
      <label>Nombre de personnes (portions)</label>
      <input type="number" id="setPers" min="1" max="12" onchange="setPersonnes(this.value)">
    </div>
    <div class="card">
      <label>Google Drive</label>
      <div id="syncStatus" style="font-size:.85rem;color:var(--txt2);font-weight:600;margin-bottom:4px">Non connecté</div>
      <button class="btn yel" id="btnConnect" onclick="driveConnect()">Connecter Google Drive</button>
      <button class="btn sec" onclick="driveSave(true)">⬆️ Sauvegarder sur Drive</button>
      <button class="btn sec" onclick="driveLoad()">⬇️ Charger depuis Drive</button>
    </div>
    <div class="card">
      <button class="btn sec" onclick="exportJson()">Exporter les données (JSON)</button>
      <input type="file" id="impFile" accept=".json" style="display:none" onchange="importJson(this)">
      <button class="btn sec" onclick="document.getElementById('impFile').click()">Importer des données (JSON)</button>
    </div>
    <div class="vtag">Foodoala v<span id="verTag2"></span> · Thomas & Cindy</div>
    <button class="btn sec" onclick="closeSettings()">Fermer</button>
  </div>
</div>

<nav>
  <button class="active" onclick="go('semaine',this)"><span class="ni">📅</span>Semaine</button>
  <button onclick="go('recettes',this)"><span class="ni">📖</span>Recettes</button>
  <button onclick="go('courses',this)"><span class="ni">🛒</span>Courses</button>
</nav>

<!-- MODAL choix recette -->
<div class="modal" id="mPick" onclick="if(event.target===this)closePick()">
  <div class="mbox">
    <h2 id="mPickTitle">Choisir une recette</h2>
    <input placeholder="Rechercher…" oninput="renderPick(this.value)" id="mPickSearch">
    <div class="picklist" id="mPickList" style="margin-top:10px"></div>
    <button class="btn sec" onclick="closePick()">Annuler</button>
  </div>
</div>

<!-- MODAL fiche recette (lecture) -->
<div class="modal" id="mDetail" onclick="if(event.target===this)closeDetail()">
  <div class="mbox">
    <div class="rdHead"><h2 id="dNom" style="margin:0"></h2><span class="rcat" id="dCat"></span></div>
    <div class="rdMeta">
      <span>⏱ <b id="dTemps"></b></span>
      <span>🍽 <b id="dPortions"></b> portions</span>
      <span>🥕 <b id="dNbIng"></b> ingrédients</span>
    </div>
    <div class="rdSection">
      <h3>Ingrédients</h3>
      <div id="dIngList"></div>
    </div>
    <div class="rdSection">
      <h3>Étapes</h3>
      <div id="dStepsList"></div>
    </div>
    <button class="btn yel" id="dEditBtn" onclick="editFromDetail()">✏️ Modifier la recette</button>
    <button class="btn sec" onclick="closeDetail()">Fermer</button>
  </div>
</div>

<!-- MODAL recette (édition) -->
<div class="modal" id="mRec" onclick="if(event.target===this)closeRec()">
  <div class="mbox">
    <h2 id="mRecTitle">Nouvelle recette</h2>
    <label>Nom</label><input id="fNom">
    <div class="mrow">
      <div><label>Catégorie</label>
        <select id="fCat"><option>Plat</option><option>Entrée</option><option>Dessert</option><option>Petit-déj</option></select></div>
      <div><label>Portions de base</label><input type="number" id="fPort" value="4" min="1"></div>
      <div><label>Temps (min)</label><input type="number" id="fTemps" min="0"></div>
    </div>
    <label>Ingrédients</label>
    <div class="inglist" id="fIngs"></div>
    <button class="btn sec sm" onclick="addIngRow()">＋ Ingrédient</button>
    <label>Étapes (une par ligne)</label>
    <textarea id="fEtapes" rows="6" placeholder="1. Éplucher les légumes…"></textarea>
    <button class="btn yel" onclick="saveRecipe()">Enregistrer</button>
    <button class="btn sec" id="fDel" onclick="deleteRecipe()" style="display:none;color:var(--red)">Supprimer la recette</button>
    <button class="btn sec" onclick="closeRec()">Fermer</button>
  </div>
</div>

<div id="toast"></div>

<script>
const APP_VERSION='1.21';
const RAYONS=['Fruits & Légumes','Boucherie','Poissonnerie','Crèmerie','Épicerie','Boulangerie','Surgelés','Autre'];
const JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const CLIENT_ID='794515583920-a9togbole8fr9njjsrjt0f1cq6utaent.apps.googleusercontent.com';
const DRIVE_FILE='foodoala_data.json';

/* ============ SEED RECETTES ============ */
function ing(nom,qte,unite,rayon){return{nom,qte,unite,rayon}}
const FL='Fruits & Légumes',BO='Boucherie',PO='Poissonnerie',CR='Crèmerie',EP='Épicerie',BL='Boulangerie',SU='Surgelés';
const SEED=[
{nom:"Spaghetti bolognaise",cat:'Plat',portions:4,temps:40,ingredients:[ing("Spaghetti",400,"g",EP),ing("Bœuf haché",400,"g",BO),ing("Tomates pelées",800,"g",EP),ing("Oignon",1,"pièce",FL),ing("Ail",2,"gousses",FL),ing("Carotte",1,"pièce",FL),ing("Parmesan",50,"g",CR)],etapes:["Émincer l'oignon, l'ail et la carotte, puis les faire revenir 5 min dans un filet d'huile.","Ajouter le bœuf haché, saler, poivrer et faire colorer 5 min en émiettant à la fourchette.","Ajouter les tomates pelées, laisser mijoter 25 min à feu doux en remuant de temps en temps.","Cuire les spaghetti al dente dans l'eau bouillante salée, égoutter.","Servir les pâtes nappées de sauce, saupoudrées de parmesan."]},
{nom:"Pâtes carbonara",cat:'Plat',portions:4,temps:20,ingredients:[ing("Spaghetti",400,"g",EP),ing("Lardons",200,"g",BO),ing("Œufs",4,"pièces",CR),ing("Parmesan",80,"g",CR),ing("Poivre noir",1,"pincée",EP)],etapes:["Cuire les spaghetti al dente dans l'eau bouillante salée.","Pendant ce temps, faire revenir les lardons à sec dans une poêle jusqu'à ce qu'ils soient dorés.","Battre les œufs avec le parmesan et une bonne dose de poivre.","Égoutter les pâtes en gardant un peu d'eau de cuisson, les mélanger hors du feu aux lardons puis à l'appareil œufs-parmesan.","Servir aussitôt, la chaleur des pâtes suffit à cuire l'appareil."]},
{nom:"Poulet rôti & pommes de terre",cat:'Plat',portions:4,temps:80,ingredients:[ing("Poulet fermier",1,"pièce",BO),ing("Pommes de terre",1,"kg",FL),ing("Ail",4,"gousses",FL),ing("Thym",1,"branche",FL),ing("Beurre",30,"g",CR)],etapes:["Préchauffer le four à 200°C.","Badigeonner le poulet de beurre, saler, poivrer, glisser l'ail et le thym à l'intérieur.","Couper les pommes de terre en gros morceaux et les disposer autour du poulet dans un plat.","Enfourner 1h15, en arrosant régulièrement avec le jus de cuisson.","Vérifier la cuisson (jus clair à la pointe du couteau) avant de servir."]},
{nom:"Quiche lorraine",cat:'Plat',portions:4,temps:50,ingredients:[ing("Pâte brisée",1,"pièce",CR),ing("Lardons",200,"g",BO),ing("Œufs",3,"pièces",CR),ing("Crème fraîche",20,"cl",CR),ing("Gruyère râpé",100,"g",CR)],etapes:["Préchauffer le four à 180°C et foncer un moule avec la pâte brisée.","Faire revenir les lardons quelques minutes à sec, puis les répartir sur la pâte.","Battre les œufs avec la crème fraîche, saler légèrement, poivrer.","Verser l'appareil sur les lardons, parsemer de gruyère râpé.","Enfourner 35 min jusqu'à ce que la quiche soit dorée."]},
{nom:"Gratin dauphinois",cat:'Plat',portions:4,temps:75,ingredients:[ing("Pommes de terre",1.2,"kg",FL),ing("Crème liquide",40,"cl",CR),ing("Lait",20,"cl",CR),ing("Ail",2,"gousses",FL),ing("Muscade",1,"pincée",EP)],etapes:["Préchauffer le four à 180°C. Éplucher et couper les pommes de terre en fines rondelles.","Frotter un plat à gratin avec l'ail, puis y disposer les pommes de terre.","Mélanger la crème, le lait, sel, poivre et muscade, verser sur les pommes de terre.","Enfourner 1h à 1h15 jusqu'à ce que le dessus soit doré et les pommes de terre fondantes."]},
{nom:"Steak haché & purée",cat:'Plat',portions:4,temps:30,ingredients:[ing("Steaks hachés",4,"pièces",BO),ing("Pommes de terre",1,"kg",FL),ing("Beurre",50,"g",CR),ing("Lait",15,"cl",CR)],etapes:["Cuire les pommes de terre épluchées et coupées 20 min dans l'eau bouillante salée.","Les écraser en purée avec le beurre et le lait chaud, saler, poivrer.","Cuire les steaks hachés à la poêle selon la cuisson désirée, 2 à 4 min de chaque côté.","Servir immédiatement avec la purée."]},
{nom:"Saumon, riz & brocolis",cat:'Plat',portions:4,temps:30,ingredients:[ing("Pavés de saumon",4,"pièces",PO),ing("Riz",300,"g",EP),ing("Brocoli",1,"pièce",FL),ing("Citron",1,"pièce",FL)],etapes:["Cuire le riz selon les instructions du paquet.","Cuire le brocoli en fleurettes à la vapeur 8 à 10 min.","Saisir les pavés de saumon à la poêle 4 min de chaque côté, arroser de jus de citron.","Dresser le riz, le brocoli et le saumon ensemble."]},
{nom:"Poulet curry coco & riz",cat:'Plat',portions:4,temps:35,ingredients:[ing("Filets de poulet",600,"g",BO),ing("Lait de coco",40,"cl",EP),ing("Curry en poudre",2,"c.à.s",EP),ing("Riz basmati",300,"g",EP),ing("Oignon",1,"pièce",FL)],etapes:["Émincer l'oignon et le faire revenir dans un peu d'huile.","Couper le poulet en morceaux, l'ajouter et le faire dorer 5 min.","Saupoudrer de curry, mélanger, puis verser le lait de coco.","Laisser mijoter 15 min à couvert. Cuire le riz basmati en parallèle.","Servir le curry sur le riz."]},
{nom:"Chili con carne",cat:'Plat',portions:4,temps:45,ingredients:[ing("Bœuf haché",500,"g",BO),ing("Haricots rouges",400,"g",EP),ing("Tomates concassées",800,"g",EP),ing("Maïs",140,"g",EP),ing("Oignon",1,"pièce",FL),ing("Épices chili",1,"sachet",EP),ing("Riz",300,"g",EP)],etapes:["Faire revenir l'oignon émincé, ajouter le bœuf haché et le faire colorer.","Ajouter les épices, mélanger 1 min pour les torréfier légèrement.","Verser les tomates concassées, les haricots rouges égouttés et le maïs.","Laisser mijoter 30 min à feu doux en remuant de temps en temps.","Servir avec du riz blanc."]},
{nom:"Lasagnes maison",cat:'Plat',portions:6,temps:70,ingredients:[ing("Feuilles de lasagne",250,"g",EP),ing("Bœuf haché",600,"g",BO),ing("Tomates pelées",800,"g",EP),ing("Béchamel",50,"cl",EP),ing("Gruyère râpé",150,"g",CR),ing("Oignon",1,"pièce",FL)],etapes:["Préchauffer le four à 190°C. Faire revenir l'oignon puis le bœuf haché, ajouter les tomates et laisser mijoter 20 min.","Dans un plat, alterner couches de feuilles de lasagne, sauce bolognaise et béchamel.","Terminer par une couche de béchamel et le gruyère râpé.","Enfourner 35 min jusqu'à ce que le dessus soit gratiné."]},
{nom:"Omelette champignons & salade",cat:'Plat',portions:2,temps:15,ingredients:[ing("Œufs",6,"pièces",CR),ing("Champignons de Paris",250,"g",FL),ing("Salade verte",1,"pièce",FL),ing("Beurre",20,"g",CR)],etapes:["Émincer et faire revenir les champignons dans le beurre jusqu'à évaporation de l'eau de végétation.","Battre les œufs, saler, poivrer, verser sur les champignons.","Cuire à feu moyen en repliant les bords vers le centre jusqu'à la cuisson désirée.","Servir avec la salade verte assaisonnée."]},
{nom:"Croque-monsieur",cat:'Plat',portions:2,temps:15,ingredients:[ing("Pain de mie",8,"tranches",BL),ing("Jambon blanc",4,"tranches",BO),ing("Gruyère râpé",120,"g",CR),ing("Beurre",30,"g",CR)],etapes:["Beurrer les tranches de pain de mie sur une face.","Garnir 4 tranches de jambon et de gruyère, recouvrir des 4 autres tranches.","Faire dorer à la poêle ou au four 8 à 10 min de chaque côté jusqu'à ce que le fromage fonde."]},
{nom:"Salade César",cat:'Plat',portions:2,temps:20,ingredients:[ing("Salade romaine",1,"pièce",FL),ing("Filets de poulet",300,"g",BO),ing("Parmesan",40,"g",CR),ing("Croûtons",80,"g",EP),ing("Sauce César",1,"pot",EP)],etapes:["Cuire les filets de poulet à la poêle 6 à 8 min de chaque côté, puis les émincer.","Laver et couper la salade romaine.","Mélanger la salade, le poulet, les croûtons et le parmesan en copeaux.","Napper de sauce César au moment de servir."]},
{nom:"Risotto aux champignons",cat:'Plat',portions:4,temps:40,ingredients:[ing("Riz arborio",320,"g",EP),ing("Champignons de Paris",400,"g",FL),ing("Bouillon de volaille",1,"L",EP),ing("Parmesan",60,"g",CR),ing("Oignon",1,"pièce",FL),ing("Vin blanc",10,"cl",EP)],etapes:["Faire revenir l'oignon émincé, ajouter le riz et le nacrer 2 min.","Déglacer au vin blanc, laisser évaporer.","Ajouter le bouillon chaud louche par louche, en remuant, jusqu'à absorption complète (environ 18 min).","En parallèle, faire sauter les champignons émincés à la poêle.","Incorporer les champignons et le parmesan hors du feu, rectifier l'assaisonnement."]},
{nom:"Tartiflette",cat:'Plat',portions:4,temps:60,ingredients:[ing("Pommes de terre",1.2,"kg",FL),ing("Reblochon",1,"pièce",CR),ing("Lardons",200,"g",BO),ing("Oignon",2,"pièces",FL),ing("Crème fraîche",15,"cl",CR)],etapes:["Préchauffer le four à 200°C. Cuire les pommes de terre en robe des champs 20 min, puis les éplucher et les couper en rondelles.","Faire revenir les oignons émincés et les lardons quelques minutes.","Dans un plat, disposer les pommes de terre, les lardons-oignons et la crème, mélanger.","Couper le reblochon en deux dans l'épaisseur, le poser croûte vers le haut sur le plat.","Enfourner 25 à 30 min jusqu'à ce que le fromage soit fondu et doré."]},
{nom:"Bœuf bourguignon",cat:'Plat',portions:6,temps:180,ingredients:[ing("Bœuf à braiser",1,"kg",BO),ing("Vin rouge",75,"cl",EP),ing("Carottes",4,"pièces",FL),ing("Champignons de Paris",250,"g",FL),ing("Lardons",150,"g",BO),ing("Oignon",2,"pièces",FL)],etapes:["Faire dorer les morceaux de bœuf sur toutes les faces dans une cocotte, réserver.","Faire revenir les lardons et les oignons émincés dans la même cocotte.","Remettre la viande, saupoudrer d'une cuillère de farine, mélanger.","Verser le vin rouge à hauteur, ajouter les carottes en rondelles, saler, poivrer.","Laisser mijoter à couvert 2h30 à feu doux, ajouter les champignons 20 min avant la fin."]},
{nom:"Blanquette de veau",cat:'Plat',portions:6,temps:120,ingredients:[ing("Veau (épaule)",1,"kg",BO),ing("Carottes",3,"pièces",FL),ing("Champignons de Paris",250,"g",FL),ing("Crème fraîche",20,"cl",CR),ing("Riz",400,"g",EP),ing("Oignon",1,"pièce",FL)],etapes:["Blanchir les morceaux de veau 5 min dans l'eau bouillante, rincer.","Remettre dans une cocotte avec eau à hauteur, oignon et carottes, cuire 1h30 à petits frémissements.","Ajouter les champignons émincés 15 min avant la fin.","Prélever un peu de bouillon, le mélanger à la crème fraîche puis reverser dans la cocotte pour lier la sauce.","Servir avec du riz blanc."]},
{nom:"Poêlée de légumes & œufs",cat:'Plat',portions:2,temps:20,ingredients:[ing("Poêlée de légumes surgelée",600,"g",SU),ing("Œufs",4,"pièces",CR)],etapes:["Faire revenir la poêlée de légumes surgelée à la poêle 10 à 12 min.","Creuser 4 puits dans les légumes, y casser les œufs.","Couvrir et laisser cuire 5 min jusqu'à ce que les blancs soient pris."]},
{nom:"Pizza maison",cat:'Plat',portions:4,temps:35,ingredients:[ing("Pâte à pizza",1,"pièce",CR),ing("Sauce tomate",200,"g",EP),ing("Mozzarella",250,"g",CR),ing("Jambon blanc",2,"tranches",BO),ing("Champignons de Paris",150,"g",FL)],etapes:["Préchauffer le four à 220°C. Étaler la pâte sur une plaque.","Napper de sauce tomate, répartir la mozzarella.","Ajouter le jambon en lanières et les champignons émincés.","Enfourner 12 à 15 min jusqu'à ce que la pâte soit dorée."]},
{nom:"Fajitas au poulet",cat:'Plat',portions:4,temps:30,ingredients:[ing("Filets de poulet",500,"g",BO),ing("Tortillas",8,"pièces",EP),ing("Poivrons",2,"pièces",FL),ing("Oignon",1,"pièce",FL),ing("Épices fajitas",1,"sachet",EP),ing("Crème fraîche",20,"cl",CR)],etapes:["Couper le poulet, les poivrons et l'oignon en lanières.","Faire revenir le poulet à feu vif avec les épices, réserver.","Faire sauter les poivrons et l'oignon 5 min, remettre le poulet.","Réchauffer les tortillas et garnir avec la préparation et la crème fraîche."]},
{nom:"Soupe de légumes",cat:'Entrée',portions:4,temps:40,ingredients:[ing("Carottes",3,"pièces",FL),ing("Poireaux",2,"pièces",FL),ing("Pommes de terre",400,"g",FL),ing("Courgette",1,"pièce",FL),ing("Bouillon de légumes",1,"cube",EP)],etapes:["Éplucher et couper tous les légumes en morceaux.","Les mettre dans une cocotte, couvrir d'eau, ajouter le bouillon cube.","Cuire 30 min à couvert jusqu'à ce que les légumes soient tendres.","Mixer jusqu'à obtenir une texture lisse, rectifier l'assaisonnement."]},
{nom:"Hachis parmentier",cat:'Plat',portions:4,temps:60,ingredients:[ing("Bœuf haché",500,"g",BO),ing("Pommes de terre",1,"kg",FL),ing("Oignon",1,"pièce",FL),ing("Gruyère râpé",80,"g",CR),ing("Beurre",40,"g",CR),ing("Lait",15,"cl",CR)],etapes:["Préchauffer le four à 200°C. Cuire les pommes de terre 20 min, en purée avec beurre et lait.","Faire revenir l'oignon émincé puis le bœuf haché, saler, poivrer.","Dans un plat, étaler la viande puis recouvrir de purée.","Parsemer de gruyère râpé et enfourner 20 min jusqu'à coloration."]},
{nom:"Cordon bleu & haricots verts",cat:'Plat',portions:4,temps:25,ingredients:[ing("Cordons bleus",4,"pièces",BO),ing("Haricots verts",600,"g",SU),ing("Beurre",20,"g",CR)],etapes:["Cuire les cordons bleus à la poêle ou au four selon les instructions du paquet.","Cuire les haricots verts surgelés à la vapeur ou à l'eau bouillante 10 min.","Faire sauter les haricots dans le beurre 2 min avant de servir."]},
{nom:"Cabillaud & purée",cat:'Plat',portions:4,temps:30,ingredients:[ing("Dos de cabillaud",4,"pièces",PO),ing("Pommes de terre",1,"kg",FL),ing("Beurre",50,"g",CR),ing("Citron",1,"pièce",FL),ing("Lait",15,"cl",CR)],etapes:["Cuire les pommes de terre 20 min, écraser en purée avec beurre et lait.","Cuire les dos de cabillaud à la poêle 4 min de chaque côté ou au four 15 min à 180°C.","Arroser de jus de citron avant de servir avec la purée."]},
{nom:"Wok de nouilles au poulet",cat:'Plat',portions:4,temps:25,ingredients:[ing("Nouilles chinoises",300,"g",EP),ing("Filets de poulet",400,"g",BO),ing("Légumes pour wok",500,"g",SU),ing("Sauce soja",6,"c.à.s",EP),ing("Ail",2,"gousses",FL)],etapes:["Cuire les nouilles selon les instructions, égoutter.","Faire revenir le poulet coupé en lanières avec l'ail émincé à feu vif.","Ajouter les légumes pour wok, faire sauter 5 min.","Ajouter les nouilles et la sauce soja, mélanger 2 min sur feu vif."]},
{nom:"Ratatouille & semoule",cat:'Plat',portions:4,temps:50,ingredients:[ing("Aubergine",1,"pièce",FL),ing("Courgettes",2,"pièces",FL),ing("Poivrons",2,"pièces",FL),ing("Tomates",4,"pièces",FL),ing("Oignon",1,"pièce",FL),ing("Semoule",300,"g",EP)],etapes:["Couper tous les légumes en dés.","Faire revenir l'oignon, puis ajouter successivement aubergine, poivrons et courgettes en les faisant dorer.","Ajouter les tomates, saler, poivrer, laisser mijoter 30 min à couvert.","Préparer la semoule selon les instructions du paquet et servir avec la ratatouille."]},
{nom:"Galettes complètes",cat:'Plat',portions:2,temps:20,ingredients:[ing("Galettes de sarrasin",4,"pièces",CR),ing("Jambon blanc",4,"tranches",BO),ing("Œufs",4,"pièces",CR),ing("Gruyère râpé",100,"g",CR)],etapes:["Faire chauffer une galette dans une poêle légèrement beurrée.","Ajouter une tranche de jambon, du gruyère et casser un œuf au centre.","Replier les bords de la galette et laisser cuire jusqu'à ce que le blanc soit pris.","Répéter pour les autres galettes."]},
{nom:"Salade de pâtes",cat:'Plat',portions:4,temps:20,ingredients:[ing("Penne",350,"g",EP),ing("Tomates cerises",250,"g",FL),ing("Mozzarella",250,"g",CR),ing("Thon",280,"g",EP),ing("Olives noires",100,"g",EP)],etapes:["Cuire les penne al dente, égoutter et laisser refroidir.","Couper les tomates cerises en deux et la mozzarella en dés.","Mélanger les pâtes, tomates, mozzarella, thon égoutté et olives.","Assaisonner d'huile d'olive, sel et poivre, réserver au frais avant de servir."]},
{nom:"Couscous poulet & merguez",cat:'Plat',portions:6,temps:70,ingredients:[ing("Semoule",500,"g",EP),ing("Cuisses de poulet",4,"pièces",BO),ing("Merguez",6,"pièces",BO),ing("Légumes couscous",800,"g",SU),ing("Pois chiches",400,"g",EP),ing("Épices couscous",1,"sachet",EP)],etapes:["Faire dorer les cuisses de poulet dans une cocotte, ajouter les épices.","Ajouter les légumes et les pois chiches égouttés, couvrir d'eau, mijoter 40 min.","Griller les merguez à la poêle 10 min.","Préparer la semoule selon les instructions du paquet.","Servir la semoule avec le bouillon, les légumes, le poulet et les merguez."]},
{nom:"Crêpes",cat:'Dessert',portions:4,temps:30,ingredients:[ing("Farine",250,"g",EP),ing("Œufs",3,"pièces",CR),ing("Lait",50,"cl",CR),ing("Beurre",30,"g",CR),ing("Sucre",50,"g",EP)],etapes:["Mélanger la farine et le sucre, creuser un puits et ajouter les œufs.","Délayer progressivement avec le lait en fouettant pour éviter les grumeaux.","Ajouter le beurre fondu, laisser reposer 30 min.","Cuire les crêpes dans une poêle chaude et légèrement beurrée, 1 à 2 min de chaque côté."]},
{nom:"Poulet basquaise",cat:'Plat',portions:4,temps:50,ingredients:[ing("Cuisses de poulet",4,"pièces",BO),ing("Poivrons",3,"pièces",FL),ing("Tomates",4,"pièces",FL),ing("Oignon",2,"pièces",FL),ing("Ail",2,"gousses",FL),ing("Piment d'Espelette",1,"pincée",EP)],etapes:["Faire dorer les cuisses de poulet dans une cocotte, réserver.","Faire revenir oignons, poivrons émincés et ail 5 min.","Ajouter les tomates concassées, le piment d'Espelette, remettre le poulet.","Laisser mijoter à couvert 35 min à feu doux."]},
{nom:"Moules marinières",cat:'Plat',portions:4,temps:25,ingredients:[ing("Moules",2,"kg",PO),ing("Échalotes",3,"pièces",FL),ing("Vin blanc",20,"cl",EP),ing("Crème fraîche",10,"cl",CR),ing("Persil",1,"botte",FL)],etapes:["Laver et trier les moules, jeter celles qui restent ouvertes.","Faire revenir les échalotes émincées dans un peu de beurre.","Ajouter le vin blanc, porter à ébullition, verser les moules.","Couvrir et cuire 5 à 7 min en remuant, jusqu'à ce qu'elles soient ouvertes.","Ajouter la crème et le persil ciselé avant de servir."]},
{nom:"Tarte aux poireaux",cat:'Plat',portions:4,temps:50,ingredients:[ing("Pâte brisée",1,"pièce",CR),ing("Poireaux",4,"pièces",FL),ing("Œufs",3,"pièces",CR),ing("Crème fraîche",20,"cl",CR),ing("Gruyère râpé",80,"g",CR)],etapes:["Préchauffer le four à 180°C, foncer un moule avec la pâte.","Émincer les poireaux et les faire fondre 15 min à la poêle avec un peu de beurre.","Battre les œufs avec la crème, saler, poivrer, mélanger aux poireaux.","Verser sur la pâte, parsemer de gruyère et enfourner 30 min."]},
{nom:"Poêlée de crevettes à l'ail",cat:'Plat',portions:4,temps:20,ingredients:[ing("Crevettes décortiquées",500,"g",PO),ing("Ail",4,"gousses",FL),ing("Persil",1,"botte",FL),ing("Riz",300,"g",EP),ing("Citron",1,"pièce",FL)],etapes:["Cuire le riz selon les instructions du paquet.","Faire chauffer un filet d'huile d'olive, ajouter l'ail émincé.","Ajouter les crevettes, saisir 3 à 4 min à feu vif jusqu'à ce qu'elles soient roses.","Ajouter le persil ciselé et un filet de citron, servir avec le riz."]},
{nom:"Escalopes de dinde à la crème",cat:'Plat',portions:4,temps:25,ingredients:[ing("Escalopes de dinde",4,"pièces",BO),ing("Champignons de Paris",250,"g",FL),ing("Crème fraîche",20,"cl",CR),ing("Échalote",1,"pièce",FL),ing("Pâtes",350,"g",EP)],etapes:["Cuire les pâtes selon les instructions du paquet.","Faire dorer les escalopes 3 min de chaque côté, réserver.","Faire revenir l'échalote et les champignons émincés dans la même poêle.","Ajouter la crème, laisser réduire 3 min, remettre les escalopes pour les réchauffer.","Servir avec les pâtes."]},
{nom:"Chou-fleur gratiné",cat:'Plat',portions:4,temps:45,ingredients:[ing("Chou-fleur",1,"pièce",FL),ing("Béchamel",40,"cl",EP),ing("Gruyère râpé",120,"g",CR),ing("Jambon blanc",4,"tranches",BO)],etapes:["Cuire le chou-fleur en fleurettes 15 min à la vapeur.","Préchauffer le four à 200°C.","Disposer le chou-fleur et le jambon coupé en morceaux dans un plat, napper de béchamel.","Parsemer de gruyère et enfourner 20 min jusqu'à coloration."]},
{nom:"Filet mignon de porc au miel",cat:'Plat',portions:4,temps:40,ingredients:[ing("Filet mignon de porc",1,"pièce",BO),ing("Miel",3,"c.à.s",EP),ing("Moutarde",2,"c.à.s",EP),ing("Pommes de terre",800,"g",FL),ing("Thym",1,"branche",FL)],etapes:["Préchauffer le four à 200°C. Mélanger miel et moutarde, en badigeonner le filet mignon.","Couper les pommes de terre en morceaux, les disposer dans un plat avec le filet mignon et le thym.","Enfourner 35 min en arrosant à mi-cuisson.","Laisser reposer 5 min avant de trancher."]},
{nom:"Riz cantonais",cat:'Plat',portions:4,temps:25,ingredients:[ing("Riz",300,"g",EP),ing("Œufs",2,"pièces",CR),ing("Petits pois",150,"g",SU),ing("Jambon blanc",2,"tranches",BO),ing("Sauce soja",3,"c.à.s",EP)],etapes:["Cuire le riz la veille de préférence, ou le laisser refroidir.","Battre les œufs et les cuire en omelette fine, couper en lanières.","Faire sauter le riz à feu vif avec les petits pois et le jambon en dés.","Ajouter l'omelette et la sauce soja, bien mélanger."]},
{nom:"Endives au jambon",cat:'Plat',portions:4,temps:50,ingredients:[ing("Endives",8,"pièces",FL),ing("Jambon blanc",8,"tranches",BO),ing("Béchamel",40,"cl",EP),ing("Gruyère râpé",100,"g",CR)],etapes:["Cuire les endives 20 min à la vapeur ou à l'eau salée.","Préchauffer le four à 200°C. Enrouler chaque endive dans une tranche de jambon.","Disposer dans un plat, napper de béchamel et parsemer de gruyère.","Enfourner 20 min jusqu'à gratinage."]},
{nom:"Poisson pané & frites",cat:'Plat',portions:4,temps:25,ingredients:[ing("Filets de poisson panés",8,"pièces",SU),ing("Frites surgelées",600,"g",SU),ing("Citron",1,"pièce",FL)],etapes:["Cuire les frites au four ou à la friteuse selon les instructions du paquet.","Cuire les filets de poisson panés à la poêle ou au four selon les instructions.","Servir avec un quartier de citron."]},
{nom:"Tajine de poulet aux abricots",cat:'Plat',portions:4,temps:60,ingredients:[ing("Cuisses de poulet",4,"pièces",BO),ing("Abricots secs",150,"g",EP),ing("Oignon",2,"pièces",FL),ing("Cannelle",1,"pincée",EP),ing("Amandes effilées",50,"g",EP),ing("Semoule",300,"g",EP)],etapes:["Faire dorer les cuisses de poulet dans une cocotte, réserver.","Faire revenir les oignons émincés avec la cannelle.","Remettre le poulet, ajouter les abricots secs et de l'eau à mi-hauteur.","Laisser mijoter à couvert 40 min.","Parsemer d'amandes effilées grillées et servir avec la semoule."]},
{nom:"Salade de chèvre chaud",cat:'Entrée',portions:2,temps:20,ingredients:[ing("Fromage de chèvre",1,"bûche",CR),ing("Pain de mie",4,"tranches",BL),ing("Salade verte",1,"pièce",FL),ing("Miel",2,"c.à.s",EP),ing("Noix",40,"g",EP)],etapes:["Préchauffer le four en position grill.","Couper le chèvre en rondelles et les poser sur les tranches de pain.","Passer au grill 5 min jusqu'à ce que le fromage soit doré.","Dresser sur la salade assaisonnée, arroser de miel et parsemer de noix."]},
{nom:"Boulettes de bœuf sauce tomate",cat:'Plat',portions:4,temps:40,ingredients:[ing("Bœuf haché",500,"g",BO),ing("Chapelure",50,"g",EP),ing("Œuf",1,"pièce",CR),ing("Tomates concassées",800,"g",EP),ing("Ail",2,"gousses",FL),ing("Pâtes",350,"g",EP)],etapes:["Mélanger le bœuf haché, la chapelure, l'œuf, sel et poivre, former des boulettes.","Faire dorer les boulettes à la poêle sur toutes les faces.","Ajouter les tomates concassées et l'ail écrasé, laisser mijoter 20 min.","Cuire les pâtes et servir avec les boulettes et leur sauce."]},
{nom:"Velouté de courgettes",cat:'Entrée',portions:4,temps:30,ingredients:[ing("Courgettes",1,"kg",FL),ing("Pommes de terre",300,"g",FL),ing("Oignon",1,"pièce",FL),ing("Crème fraîche",10,"cl",CR),ing("Bouillon de légumes",1,"cube",EP)],etapes:["Faire revenir l'oignon émincé, ajouter les courgettes et pommes de terre coupées.","Couvrir d'eau, ajouter le bouillon cube, cuire 20 min.","Mixer jusqu'à obtenir une texture lisse.","Ajouter la crème fraîche hors du feu avant de servir."]},
{nom:"Rôti de porc aux pruneaux",cat:'Plat',portions:6,temps:90,ingredients:[ing("Rôti de porc",1,"kg",BO),ing("Pruneaux",200,"g",EP),ing("Oignon",1,"pièce",FL),ing("Vin blanc",15,"cl",EP),ing("Crème fraîche",15,"cl",CR)],etapes:["Faire dorer le rôti sur toutes les faces dans une cocotte.","Ajouter l'oignon émincé, le vin blanc et les pruneaux.","Laisser mijoter à couvert 1h en retournant le rôti régulièrement.","Trancher le rôti, ajouter la crème fraîche à la sauce et napper."]},
{nom:"Œufs cocotte au jambon",cat:'Entrée',portions:2,temps:15,ingredients:[ing("Œufs",4,"pièces",CR),ing("Jambon blanc",2,"tranches",BO),ing("Crème fraîche",6,"c.à.s",CR),ing("Gruyère râpé",30,"g",CR)],etapes:["Préchauffer le four à 180°C.","Répartir le jambon coupé en dés dans des ramequins, ajouter une cuillère de crème.","Casser un œuf dans chaque ramequin, saler, poivrer, parsemer de gruyère.","Cuire au bain-marie 12 à 15 min au four."]},

/* ============ STATE ============ */
let state=null;
function defaultState(){
  return{recettes:SEED.map((r,i)=>({id:'seed'+i,...r})),planning:{},courses:[],personnes:2,updatedAt:Date.now()};
}
function load(){
  try{const raw=localStorage.getItem('foodoala');state=raw?JSON.parse(raw):defaultState();}
  catch(e){state=defaultState();}
  if(!state.courses)state.courses=[];
  if(!state.planning)state.planning={};
  if(!state.personnes)state.personnes=2;
}
function save(){
  state.updatedAt=Date.now();
  localStorage.setItem('foodoala',JSON.stringify(state));
  if(driveToken)driveAutoSave();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._to);t._to=setTimeout(()=>t.style.display='none',2200);}

/* ============ NAV ============ */
function go(p,btn){
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.getElementById('p-'+p).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  window.scrollTo(0,0);
}

/* ============ SEMAINE ============ */
let weekOffset=0;
function mondayOf(offset){
  const d=new Date();const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day+offset*7);d.setHours(0,0,0,0);return d;
}
function weekKey(offset){
  const m=mondayOf(offset);
  const t=new Date(m);t.setDate(t.getDate()+3);
  const jan4=new Date(t.getFullYear(),0,4);
  const wk=Math.round(((t-jan4)/864e5+((jan4.getDay()+6)%7))/7)+1;
  return t.getFullYear()+'-W'+String(wk).padStart(2,'0');
}
function chWeek(d){weekOffset+=d;renderWeek();}
function fmtD(d){return d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0');}
function renderWeek(){
  const key=weekKey(weekOffset),mon=mondayOf(weekOffset),sun=new Date(mon);sun.setDate(sun.getDate()+6);
  document.getElementById('wkLbl').textContent='Semaine '+key.split('W')[1]+(weekOffset===0?' · cette semaine':'');
  document.getElementById('wkDates').textContent=fmtD(mon)+' → '+fmtD(sun);
  const plan=state.planning[key]||{};
  const today=new Date();today.setHours(0,0,0,0);
  let html='';
  for(let d=0;d<7;d++){
    const dd=new Date(mon);dd.setDate(dd.getDate()+d);
    const isToday=dd.getTime()===today.getTime();
    html+=`<div class="day${isToday?' today':''}"><div class="dayhead">${JOURS[d]} ${fmtD(dd)}</div>`;
    for(const rep of['midi','soir']){
      const rid=plan[d+'_'+rep];
      const rec=rid?state.recettes.find(r=>r.id===rid):null;
      html+=`<div class="meal"><span class="mlbl">${rep}</span>
      <button class="msel${rec?'':' empty'}" onclick="openPick('${key}','${d}_${rep}')">${rec?rec.nom:'— choisir un plat —'}</button>
      ${rec?`<button class="mx" onclick="unset('${key}','${d}_${rep}')">✕</button>`:''}</div>`;
    }
    html+='</div>';
  }
  document.getElementById('weekList').innerHTML=html;
}
function unset(key,slot){delete state.planning[key][slot];save();renderWeek();}

/* pick modal */
let pickTarget=null;
function openPick(key,slot){pickTarget={key,slot};document.getElementById('mPickSearch').value='';renderPick('');document.getElementById('mPick').classList.add('open');}
function closePick(){document.getElementById('mPick').classList.remove('open');}
function renderPick(q){
  q=(q||'').toLowerCase();
  const list=state.recettes.filter(r=>r.nom.toLowerCase().includes(q)).sort((a,b)=>a.nom.localeCompare(b.nom));
  document.getElementById('mPickList').innerHTML=list.map(r=>
    `<div class="rcard" onclick="pick('${r.id}')"><div><div class="rn">${r.nom}</div><div class="rm">${r.temps?r.temps+' min · ':''}${r.ingredients.length} ingrédients</div></div><span class="rcat">${r.cat}</span></div>`
  ).join('')||'<div class="empty">Aucune recette</div>';
}
function pick(id){
  if(!state.planning[pickTarget.key])state.planning[pickTarget.key]={};
  state.planning[pickTarget.key][pickTarget.slot]=id;
  save();closePick();renderWeek();
}

/* ============ RECETTES ============ */
let catFilter='Toutes';
function renderCatChips(){
  const cats=['Toutes','Plat','Entrée','Dessert','Petit-déj'];
  document.getElementById('catChips').innerHTML=cats.map(c=>
    `<button class="chip${c===catFilter?' active':''}" onclick="catFilter='${c}';renderCatChips();renderRecettes()">${c}</button>`).join('');
}
function renderRecettes(){
  const q=document.getElementById('rSearch').value.toLowerCase();
  const list=state.recettes.filter(r=>(catFilter==='Toutes'||r.cat===catFilter)&&r.nom.toLowerCase().includes(q))
    .sort((a,b)=>a.nom.localeCompare(b.nom));
  document.getElementById('recList').innerHTML=list.map(r=>
    `<div class="rcard" onclick="openDetail('${r.id}')"><div><div class="rn">${r.nom}</div><div class="rm">${r.portions} portions${r.temps?' · '+r.temps+' min':''} · ${r.ingredients.length} ingrédients</div></div><span class="rcat">${r.cat}</span></div>`
  ).join('')||'<div class="empty">Aucune recette</div>';
}

let detailId=null;
function openDetail(id){
  detailId=id;
  const r=state.recettes.find(x=>x.id===id);
  if(!r)return;
  document.getElementById('dNom').textContent=r.nom;
  document.getElementById('dCat').textContent=r.cat;
  document.getElementById('dTemps').textContent=r.temps?r.temps+' min':'—';
  document.getElementById('dPortions').textContent=r.portions;
  document.getElementById('dNbIng').textContent=r.ingredients.length;
  document.getElementById('dIngList').innerHTML=r.ingredients.map(i=>
    `<div class="rdIng"><span>${i.nom}</span><span class="qn">${i.qte?i.qte+' '+(i.unite||''):''}</span></div>`).join('');
  const steps=r.etapes&&r.etapes.length?r.etapes:null;
  document.getElementById('dStepsList').innerHTML=steps?
    steps.map((s,i)=>`<div class="rdStep"><span class="num">${i+1}</span><p>${s}</p></div>`).join('')
    :'<div class="empty">Aucune étape renseignée.</div>';
  document.getElementById('mDetail').classList.add('open');
}
function closeDetail(){document.getElementById('mDetail').classList.remove('open');}
function editFromDetail(){const id=detailId;closeDetail();openRecipeForm(id);}

/* recipe form */
let editId=null;
function openRecipeForm(id){
  editId=id||null;
  const r=id?state.recettes.find(x=>x.id===id):null;
  document.getElementById('mRecTitle').textContent=r?'Modifier la recette':'Nouvelle recette';
  document.getElementById('fNom').value=r?r.nom:'';
  document.getElementById('fCat').value=r?r.cat:'Plat';
  document.getElementById('fPort').value=r?r.portions:4;
  document.getElementById('fTemps').value=r&&r.temps?r.temps:'';
  document.getElementById('fDel').style.display=r?'block':'none';
  document.getElementById('fIngs').innerHTML='';
  (r?r.ingredients:[{nom:'',qte:'',unite:'',rayon:EP}]).forEach(addIngRow);
  document.getElementById('fEtapes').value=r&&r.etapes?r.etapes.join('\n'):'';
  document.getElementById('mRec').classList.add('open');
}
function closeRec(){document.getElementById('mRec').classList.remove('open');}
function addIngRow(i){
  i=i&&i.nom!==undefined?i:{nom:'',qte:'',unite:'',rayon:EP};
  const div=document.createElement('div');div.className='ingrow';
  div.innerHTML=`<input placeholder="Ingrédient" value="${i.nom||''}" class="inom">
  <input placeholder="Qté" value="${i.qte??''}" class="qte" inputmode="decimal">
  <input placeholder="Unité" value="${i.unite||''}" class="uni">
  <select>${RAYONS.map(r=>`<option${r===i.rayon?' selected':''}>${r}</option>`).join('')}</select>
  <button class="del" onclick="this.parentNode.remove()">✕</button>`;
  document.getElementById('fIngs').appendChild(div);
}
function saveRecipe(){
  const nom=document.getElementById('fNom').value.trim();
  if(!nom){toast('Nom requis');return;}
  const ings=[...document.querySelectorAll('#fIngs .ingrow')].map(row=>({
    nom:row.querySelector('.inom').value.trim(),
    qte:parseFloat(String(row.querySelector('.qte').value).replace(',','.'))||0,
    unite:row.querySelector('.uni').value.trim(),
    rayon:row.querySelector('select').value
  })).filter(i=>i.nom);
  const etapes=document.getElementById('fEtapes').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const rec={id:editId||'r'+Date.now(),nom,cat:document.getElementById('fCat').value,
    portions:parseInt(document.getElementById('fPort').value)||4,
    temps:parseInt(document.getElementById('fTemps').value)||0,ingredients:ings,etapes};
  if(editId){const idx=state.recettes.findIndex(r=>r.id===editId);state.recettes[idx]=rec;}
  else state.recettes.push(rec);
  save();closeRec();renderRecettes();renderWeek();toast('Recette enregistrée');
}
function deleteRecipe(){
  if(!confirm('Supprimer cette recette ?'))return;
  state.recettes=state.recettes.filter(r=>r.id!==editId);
  for(const wk in state.planning)for(const slot in state.planning[wk])
    if(state.planning[wk][slot]===editId)delete state.planning[wk][slot];
  save();closeRec();renderRecettes();renderWeek();toast('Recette supprimée');
}

/* ============ COURSES ============ */
function genCourses(){
  const key=weekKey(weekOffset),plan=state.planning[key]||{};
  const agg={};
  for(const slot in plan){
    const rec=state.recettes.find(r=>r.id===plan[slot]);
    if(!rec)continue;
    const ratio=state.personnes/(rec.portions||4);
    for(const i of rec.ingredients){
      const k=(i.nom+'|'+i.unite).toLowerCase();
      if(!agg[k])agg[k]={nom:i.nom,unite:i.unite,rayon:i.rayon,qte:0};
      agg[k].qte+=i.qte*ratio;
    }
  }
  const manual=state.courses.filter(c=>c.manual);
  state.courses=Object.values(agg).map(a=>({id:'c'+Math.random().toString(36).slice(2),nom:a.nom,
    qte:Math.round(a.qte*100)/100,unite:a.unite,rayon:a.rayon,done:false})).concat(manual);
  save();renderCourses();
  toast(Object.keys(agg).length?'Liste générée ('+key+')':'Aucun plat planifié cette semaine');
}
function renderCourses(){
  const list=state.courses;
  const remaining=list.filter(c=>!c.done).length;
  document.getElementById('cCount').textContent=list.length?remaining+' / '+list.length:'';
  document.getElementById('cClear').style.display=list.some(c=>c.done)?'block':'none';
  if(!list.length){document.getElementById('courseList').innerHTML='<div class="empty">Liste vide.<br>Planifie ta semaine puis génère la liste 🐨</div>';return;}
  let html='';
  for(const ray of RAYONS){
    const items=list.filter(c=>c.rayon===ray);
    if(!items.length)continue;
    html+=`<div class="rayon"><h3>${ray}</h3>`+items.map(c=>
      `<div class="citem${c.done?' done':''}" onclick="togCourse('${c.id}')">
      <span class="cbx">${c.done?'✓':''}</span><span class="cn">${c.nom}</span>
      <span class="cq">${c.qte?c.qte+' '+(c.unite||''):''}</span></div>`).join('')+'</div>';
  }
  document.getElementById('courseList').innerHTML=html;
}
function togCourse(id){const c=state.courses.find(x=>x.id===id);c.done=!c.done;save();renderCourses();}
function addManual(){
  const inp=document.getElementById('cAdd'),v=inp.value.trim();
  if(!v)return;
  state.courses.push({id:'c'+Date.now(),nom:v,qte:0,unite:'',rayon:'Autre',done:false,manual:true});
  inp.value='';save();renderCourses();
}
function clearDone(){state.courses=state.courses.filter(c=>!c.done);save();renderCourses();}

/* ============ REGLAGES ============ */
function setPersonnes(v){state.personnes=Math.max(1,parseInt(v)||2);save();toast('Portions : '+state.personnes+' pers.');}
function exportJson(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='foodoala_export_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importJson(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{state=JSON.parse(rd.result);save();refreshAll();toast('Données importées');}catch(e){toast('Fichier invalide');}};
  rd.readAsText(f);inp.value='';
}

/* ============ GOOGLE DRIVE ============ */
let driveToken=null,tokenClient=null,driveFileId=null,autoTo=null;
function initTokenClient(){
  if(tokenClient)return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
    callback:t=>{driveToken=t.access_token;
      localStorage.setItem('foodoala_drive_connected','1');
      document.getElementById('syncDot').classList.add('on');
      document.getElementById('syncStatus').textContent='Connecté ✓';
      document.getElementById('btnConnect').textContent='Reconnecter';
      driveLoad(true);},
    error_callback:()=>{/* silent attempt failed, stay disconnected */}
  });
}
function driveConnect(){
  if(!window.google){toast('Google non chargé');return;}
  initTokenClient();
  tokenClient.requestAccessToken();
}
function gisLoaded(){
  if(!window.google)return;
  initTokenClient();
  if(localStorage.getItem('foodoala_drive_connected')==='1'){
    // reconnexion rapide et silencieuse, sans popup
    tokenClient.requestAccessToken({prompt:''});
  }
}
async function driveFind(){
  if(driveFileId)return driveFileId;
  const r=await fetch("https://www.googleapis.com/drive/v3/files?q=name='"+DRIVE_FILE+"' and trashed=false&fields=files(id)",
    {headers:{Authorization:'Bearer '+driveToken}});
  const j=await r.json();
  if(j.files&&j.files.length)driveFileId=j.files[0].id;
  return driveFileId;
}
async function driveSave(manual){
  if(!driveToken){if(manual)toast('Connecte Drive d’abord');return;}
  const dot=document.getElementById('syncDot');dot.classList.add('busy');
  try{
    const id=await driveFind();
    const meta={name:DRIVE_FILE,mimeType:'application/json'};
    const body='--b\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(meta)+
      '\r\n--b\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(state)+'\r\n--b--';
    const url=id?'https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=multipart'
                :'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const r=await fetch(url,{method:id?'PATCH':'POST',
      headers:{Authorization:'Bearer '+driveToken,'Content-Type':'multipart/related; boundary=b'},body});
    const j=await r.json();driveFileId=j.id||driveFileId;
    if(manual)toast('Sauvegardé sur Drive ✓');
  }catch(e){if(manual)toast('Erreur Drive');}
  dot.classList.remove('busy');
}
async function driveLoad(silent){
  if(!driveToken){toast('Connecte Drive d’abord');return;}
  const dot=document.getElementById('syncDot');dot.classList.add('busy');
  try{
    const id=await driveFind();
    if(!id){if(!silent)toast('Aucune donnée sur Drive');await driveSave(false);}
    else{
      const r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',
        {headers:{Authorization:'Bearer '+driveToken}});
      const remote=await r.json();
      if(remote&&remote.recettes){
        if(!silent||((remote.updatedAt||0)>(state.updatedAt||0))){
          state=remote;localStorage.setItem('foodoala',JSON.stringify(state));refreshAll();
          if(!silent)toast('Chargé depuis Drive ✓');
        }else driveSave(false);
      }
    }
  }catch(e){if(!silent)toast('Erreur Drive');}
  dot.classList.remove('busy');
}
function driveAutoSave(){clearTimeout(autoTo);autoTo=setTimeout(()=>driveSave(false),3000);}
