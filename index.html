{nom:"Poulet à la kiev",cat:'Plat',portions:4,temps:40,cuisine:'Autre',saison:["Toute saison"],difficulte:'Difficile',ingredients:[ing("Filets de poulet",4,"pièces",BO),ing("Beurre",80,"g",CR),ing("Ail",2,"gousses",FL),ing("Persil",1,"botte",FL),ing("Chapelure",100,"g",EP)],etapes:["Mélanger le beurre mou avec l'ail écrasé et le persil ciselé, façonner en bûchette et réfrigérer.","Ouvrir les filets de poulet en portefeuille, insérer un morceau de beurre.","Refermer, paner (farine, œuf, chapelure).","Cuire au four 25 min à 190°C jusqu'à coloration dorée."]},
{nom:"Tofu sauté sauce cacahuète",cat:'Plat',portions:4,temps:25,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Tofu",400,"g",EP),ing("Beurre de cacahuète",3,"c.à.s",EP),ing("Sauce soja",3,"c.à.s",EP),ing("Légumes pour wok",400,"g",SU),ing("Riz",300,"g",EP)],etapes:["Couper le tofu en cubes, le faire dorer à la poêle.","Ajouter les légumes pour wok, faire sauter 5 min.","Mélanger beurre de cacahuète et sauce soja avec un peu d'eau, verser sur la préparation.","Laisser réduire 3 min, servir avec du riz."]},
{nom:"Brownie chocolat noix",cat:'Dessert',portions:8,temps:35,cuisine:'Autre',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Chocolat noir",200,"g",EP),ing("Beurre",150,"g",CR),ing("Sucre",180,"g",EP),ing("Œufs",3,"pièces",CR),ing("Farine",80,"g",EP),ing("Noix",80,"g",EP)],etapes:["Préchauffer le four à 180°C. Faire fondre le chocolat et le beurre au bain-marie.","Ajouter le sucre puis les œufs un à un, mélanger.","Incorporer la farine et les noix concassées.","Verser dans un moule, enfourner 22 à 25 min (le centre doit rester fondant)."]},
{nom:"Salade d'oranges à la cannelle",cat:'Dessert',portions:4,temps:15,cuisine:'Méditerranéenne',saison:["Hiver"],difficulte:'Facile',ingredients:[ing("Oranges",5,"pièces",FL),ing("Cannelle",1,"pincée",EP),ing("Miel",2,"c.à.s",EP)],etapes:["Éplucher les oranges à vif et les couper en rondelles.","Disposer dans un plat, arroser de miel et saupoudrer de cannelle.","Réserver au frais 30 min avant de servir."]},
{nom:"Fondant au chocolat",cat:'Dessert',portions:6,temps:25,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Chocolat noir",200,"g",EP),ing("Beurre",150,"g",CR),ing("Œufs",4,"pièces",CR),ing("Sucre",100,"g",EP),ing("Farine",50,"g",EP)],etapes:["Préchauffer le four à 200°C. Faire fondre le chocolat et le beurre.","Fouetter les œufs et le sucre, incorporer le chocolat fondu puis la farine.","Verser dans un moule beurré.","Enfourner 10 à 12 min, le centre doit rester coulant."]},
{nom:"Crumble aux pommes",cat:'Dessert',portions:6,temps:45,cuisine:'Autre',saison:["Automne"],difficulte:'Moyen',ingredients:[ing("Pommes",5,"pièces",FL),ing("Farine",150,"g",EP),ing("Beurre",100,"g",CR),ing("Sucre roux",100,"g",EP),ing("Cannelle",1,"pincée",EP)],etapes:["Préchauffer le four à 180°C. Éplucher et couper les pommes en morceaux, les disposer dans un plat avec la cannelle.","Mélanger farine, beurre froid en dés et sucre du bout des doigts jusqu'à obtenir une texture sableuse.","Répartir sur les pommes.","Enfourner 30 min jusqu'à ce que le dessus soit doré."]},
{nom:"Verrines spéculoos mascarpone",cat:'Dessert',portions:4,temps:15,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Facile',ingredients:[ing("Spéculoos",12,"pièces",EP),ing("Mascarpone",250,"g",CR),ing("Sucre",30,"g",EP),ing("Crème liquide",10,"cl",CR)],etapes:["Écraser grossièrement les spéculoos.","Fouetter le mascarpone avec le sucre et la crème jusqu'à texture mousseuse.","Alterner couches de spéculoos et de crème dans des verrines.","Réserver au frais avant de servir."]},
{nom:"Compote pommes-poires",cat:'Dessert',portions:4,temps:25,cuisine:'Française',saison:["Automne"],difficulte:'Moyen',ingredients:[ing("Pommes",4,"pièces",FL),ing("Poires",3,"pièces",FL),ing("Sucre",30,"g",EP),ing("Vanille",1,"gousse",EP)],etapes:["Éplucher et couper les fruits en morceaux.","Cuire à feu doux avec un fond d'eau, le sucre et la vanille pendant 20 min.","Mixer plus ou moins selon la texture souhaitée."]},
{nom:"Chilaquiles verts",cat:'Plat',portions:4,temps:25,cuisine:'Mexicaine',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Tortillas de maïs",10,"pièces",EP),ing("Sauce tomatillo verte",300,"g",EP),ing("Œufs",4,"pièces",CR),ing("Fromage râpé",80,"g",CR),ing("Oignon rouge",1,"pièce",FL)],etapes:["Couper les tortillas en triangles, les faire frire ou griller jusqu'à ce qu'elles soient croustillantes.","Faire chauffer la sauce tomatillo dans une poêle, ajouter les tortillas et mélanger 2 min.","Cuire les œufs au plat séparément.","Servir garni de fromage râpé, oignon rouge émincé et un œuf par assiette."]},
{nom:"Poulet à la mexicaine & riz",cat:'Plat',portions:4,temps:35,cuisine:'Mexicaine',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",500,"g",BO),ing("Maïs",200,"g",EP),ing("Haricots rouges",400,"g",EP),ing("Tomates concassées",400,"g",EP),ing("Épices tex-mex",1,"sachet",EP),ing("Riz",300,"g",EP)],etapes:["Couper le poulet en morceaux, le faire dorer avec les épices.","Ajouter les tomates, le maïs et les haricots égouttés.","Laisser mijoter 20 min à couvert.","Servir avec du riz."]},
{nom:"Salade mexicaine au poulet",cat:'Plat',portions:4,temps:20,cuisine:'Mexicaine',saison:["Été"],difficulte:'Facile',ingredients:[ing("Filets de poulet",400,"g",BO),ing("Salade",1,"pièce",FL),ing("Maïs",150,"g",EP),ing("Tomates cerises",200,"g",FL),ing("Avocat",1,"pièce",FL),ing("Tortillas",2,"pièces",EP)],etapes:["Cuire le poulet à la poêle et le trancher.","Couper les tortillas en lanières et les griller à sec pour les rendre croustillantes.","Mélanger salade, maïs, tomates cerises et avocat en dés.","Ajouter le poulet et les lanières de tortilla, assaisonner."]},
{nom:"Riz mexicain épicé",cat:'Plat',portions:4,temps:30,cuisine:'Mexicaine',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Riz",300,"g",EP),ing("Tomates concassées",400,"g",EP),ing("Oignon",1,"pièce",FL),ing("Poivron",1,"pièce",FL),ing("Épices tex-mex",1,"sachet",EP)],etapes:["Faire revenir l'oignon et le poivron émincés.","Ajouter le riz, mélanger 1 min pour l'enrober.","Ajouter les tomates concassées, les épices et de l'eau à hauteur.","Couvrir et cuire 18 min à feu doux."]},
{nom:"Tostadas au poulet effiloché",cat:'Plat',portions:4,temps:30,cuisine:'Mexicaine',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Tortillas de maïs",8,"pièces",EP),ing("Filets de poulet",400,"g",BO),ing("Haricots noirs",400,"g",EP),ing("Salade",1,"pièce",FL),ing("Fromage râpé",80,"g",CR)],etapes:["Cuire le poulet à l'eau ou au bouillon 15 min, l'effilocher.","Faire griller les tortillas à sec jusqu'à ce qu'elles soient croustillantes.","Tartiner de haricots noirs écrasés, garnir de poulet, salade et fromage."]},
{nom:"Soupe tortilla au poulet",cat:'Entrée',portions:4,temps:35,cuisine:'Mexicaine',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",300,"g",BO),ing("Bouillon de volaille",1,"L",EP),ing("Tomates concassées",400,"g",EP),ing("Tortillas",4,"pièces",EP),ing("Avocat",1,"pièce",FL)],etapes:["Cuire le poulet dans le bouillon 15 min, l'effilocher.","Ajouter les tomates concassées, laisser mijoter 10 min.","Couper les tortillas en lanières, les griller à sec.","Servir la soupe garnie de tortillas croustillantes et d'avocat."]},
{nom:"Poulet Kung Pao",cat:'Plat',portions:4,temps:30,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",500,"g",BO),ing("Cacahuètes",60,"g",EP),ing("Poivrons",2,"pièces",FL),ing("Sauce soja",4,"c.à.s",EP),ing("Ail",2,"gousses",FL)],etapes:["Couper le poulet en cubes, le faire dorer à feu vif.","Ajouter les poivrons émincés et l'ail, faire sauter 5 min.","Ajouter la sauce soja et les cacahuètes, mélanger 2 min.","Servir avec du riz."]},
{nom:"Bœuf sauté à l'oignon nouveau",cat:'Plat',portions:4,temps:20,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Bœuf (émincé)",450,"g",BO),ing("Oignon nouveau",5,"pièces",FL),ing("Sauce soja",4,"c.à.s",EP),ing("Gingembre",1,"morceau",FL),ing("Riz",300,"g",EP)],etapes:["Faire mariner le bœuf dans la sauce soja et le gingembre râpé 10 min.","Saisir à feu vif 2 min, réserver.","Faire sauter les oignons nouveaux 2 min, remettre le bœuf.","Servir avec du riz."]},
{nom:"Porc caramélisé vietnamien",cat:'Plat',portions:4,temps:35,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Porc (échine)",500,"g",BO),ing("Sauce nuoc-mâm",4,"c.à.s",EP),ing("Sucre roux",3,"c.à.s",EP),ing("Ail",2,"gousses",FL),ing("Riz",300,"g",EP)],etapes:["Couper le porc en petits morceaux.","Faire caraméliser le sucre à sec dans une cocotte jusqu'à coloration ambrée.","Ajouter le porc, l'ail et le nuoc-mâm, mélanger.","Laisser mijoter 20 min à couvert jusqu'à ce que la sauce nappe la viande.","Servir avec du riz."]},
{nom:"Salade de vermicelles au poulet",cat:'Plat',portions:4,temps:25,cuisine:'Asiatique',saison:["Été"],difficulte:'Moyen',ingredients:[ing("Vermicelles de riz",250,"g",EP),ing("Filets de poulet",350,"g",BO),ing("Carotte",1,"pièce",FL),ing("Menthe",1,"botte",FL),ing("Nuoc-mâm",3,"c.à.s",EP)],etapes:["Faire tremper les vermicelles dans l'eau chaude 10 min, égoutter.","Cuire le poulet à la poêle et le trancher.","Râper la carotte, ciseler la menthe.","Mélanger tous les ingrédients avec la sauce nuoc-mâm."]},
{nom:"Soupe pho simplifiée",cat:'Plat',portions:4,temps:40,cuisine:'Asiatique',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Nouilles de riz",300,"g",EP),ing("Bœuf (émincé fin)",300,"g",BO),ing("Bouillon de bœuf",1.2,"L",EP),ing("Oignon",1,"pièce",FL),ing("Coriandre",1,"botte",FL),ing("Gingembre",1,"morceau",FL)],etapes:["Faire chauffer le bouillon avec le gingembre et l'oignon émincés 20 min.","Cuire les nouilles de riz selon les instructions.","Répartir les nouilles dans des bols, ajouter le bœuf cru émincé très finement.","Verser le bouillon très chaud dessus (il cuit la viande), parsemer de coriandre."]},
{nom:"Beignets de crevettes croustillants",cat:'Entrée',portions:4,temps:25,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Crevettes décortiquées",300,"g",PO),ing("Farine",100,"g",EP),ing("Œuf",1,"pièce",CR),ing("Eau gazeuse",15,"cl",EP),ing("Sauce sucrée-salée",1,"pot",EP)],etapes:["Préparer une pâte à beignet légère avec farine, œuf et eau gazeuse.","Tremper les crevettes dans la pâte.","Faire frire 2 à 3 min jusqu'à coloration dorée.","Servir avec la sauce sucrée-salée."]},
{nom:"Poulet sauce aigre-douce",cat:'Plat',portions:4,temps:30,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",500,"g",BO),ing("Ananas en morceaux",300,"g",EP),ing("Vinaigre",3,"c.à.s",EP),ing("Sucre",2,"c.à.s",EP),ing("Poivron",1,"pièce",FL),ing("Riz",300,"g",EP)],etapes:["Couper le poulet en cubes et le faire dorer.","Ajouter le poivron émincé, cuire 3 min.","Mélanger vinaigre, sucre et un peu de jus d'ananas, verser sur le poulet.","Ajouter l'ananas, laisser réduire 8 min, servir avec du riz."]},
{nom:"Spaghetti aux palourdes",cat:'Plat',portions:4,temps:25,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Spaghetti",400,"g",EP),ing("Palourdes",600,"g",PO),ing("Ail",3,"gousses",FL),ing("Persil",1,"botte",FL),ing("Vin blanc",10,"cl",EP)],etapes:["Faire dégorger les palourdes à l'eau salée.","Cuire les spaghetti al dente.","Faire revenir l'ail dans l'huile, ajouter les palourdes et le vin blanc, couvrir jusqu'à ouverture.","Mélanger avec les pâtes et le persil ciselé."]},
{nom:"Poulet cacciatore",cat:'Plat',portions:4,temps:55,cuisine:'Italienne',saison:["Automne"],difficulte:'Moyen',ingredients:[ing("Cuisses de poulet",4,"pièces",BO),ing("Poivrons",2,"pièces",FL),ing("Tomates concassées",400,"g",EP),ing("Olives noires",80,"g",EP),ing("Vin blanc",15,"cl",EP)],etapes:["Faire dorer le poulet, réserver.","Faire revenir les poivrons émincés, déglacer au vin blanc.","Ajouter les tomates et les olives, remettre le poulet.","Laisser mijoter à couvert 35 min."]},
{nom:"Focaccia maison",cat:'Entrée',portions:6,temps:50,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Difficile',ingredients:[ing("Farine",400,"g",EP),ing("Levure boulangère",1,"sachet",EP),ing("Huile d'olive",6,"c.à.s",EP),ing("Romarin",1,"branche",FL),ing("Gros sel",1,"pincée",EP)],etapes:["Mélanger farine, levure, eau tiède et 3 c.à.s d'huile, pétrir 10 min.","Laisser lever 1h dans un endroit tiède.","Étaler sur une plaque, creuser des trous du bout des doigts, arroser d'huile.","Parsemer de romarin et gros sel, enfourner 20 min à 220°C."]},
{nom:"Minestrone",cat:'Entrée',portions:4,temps:45,cuisine:'Italienne',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Carottes",2,"pièces",FL),ing("Courgette",1,"pièce",FL),ing("Haricots blancs",400,"g",EP),ing("Tomates concassées",400,"g",EP),ing("Pâtes courtes",100,"g",EP),ing("Parmesan",30,"g",CR)],etapes:["Couper les légumes en dés, les faire revenir 5 min.","Ajouter les tomates et couvrir d'eau, laisser mijoter 20 min.","Ajouter les haricots et les pâtes, cuire 10 min supplémentaires.","Servir avec du parmesan râpé."]},
{nom:"Escalopes de veau au marsala",cat:'Plat',portions:4,temps:25,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Escalopes de veau",4,"pièces",BO),ing("Vin marsala",10,"cl",EP),ing("Champignons de Paris",200,"g",FL),ing("Beurre",30,"g",CR),ing("Farine",2,"c.à.s",EP)],etapes:["Fariner légèrement les escalopes, les dorer 2 min de chaque côté, réserver.","Faire revenir les champignons dans le beurre.","Déglacer au marsala, laisser réduire 3 min.","Remettre les escalopes pour les réchauffer dans la sauce."]},
{nom:"Polenta crémeuse & champignons",cat:'Plat',portions:4,temps:30,cuisine:'Italienne',saison:["Automne"],difficulte:'Moyen',ingredients:[ing("Polenta",250,"g",EP),ing("Champignons de Paris",300,"g",FL),ing("Parmesan",60,"g",CR),ing("Bouillon de légumes",1,"L",EP),ing("Ail",1,"gousse",FL)],etapes:["Porter le bouillon à ébullition, verser la polenta en pluie en remuant.","Cuire 5 à 8 min en remuant jusqu'à épaississement, ajouter le parmesan.","Faire sauter les champignons avec l'ail.","Servir la polenta nappée de champignons."]},
{nom:"Steak tartare",cat:'Plat',portions:2,temps:20,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Bœuf (filet haché au couteau)",300,"g",BO),ing("Câpres",1,"c.à.s",EP),ing("Cornichons",4,"pièces",EP),ing("Échalote",1,"pièce",FL),ing("Jaune d'œuf",2,"pièces",CR)],etapes:["Hacher finement le bœuf au couteau.","Ciseler finement câpres, cornichons et échalote, mélanger à la viande.","Assaisonner de moutarde, sauce Worcestershire, sel et poivre selon le goût.","Dresser avec un jaune d'œuf sur chaque portion."]},
{nom:"Blanquette de poisson",cat:'Plat',portions:4,temps:35,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Dos de cabillaud",600,"g",PO),ing("Carottes",2,"pièces",FL),ing("Poireau",1,"pièce",FL),ing("Crème fraîche",20,"cl",CR),ing("Riz",300,"g",EP)],etapes:["Faire pocher le poisson coupé en morceaux dans un bouillon avec les légumes émincés 10 min.","Retirer le poisson, réserver.","Lier le bouillon avec la crème fraîche, laisser réduire légèrement.","Remettre le poisson pour le réchauffer, servir avec du riz."]},
{nom:"Œufs en meurette",cat:'Entrée',portions:4,temps:40,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Difficile',ingredients:[ing("Œufs",4,"pièces",CR),ing("Vin rouge",50,"cl",EP),ing("Lardons",100,"g",BO),ing("Champignons de Paris",150,"g",FL),ing("Pain",4,"tranches",BL)],etapes:["Faire revenir lardons et champignons.","Ajouter le vin rouge, laisser réduire de moitié à feu doux 20 min.","Pocher les œufs 3 min dans l'eau frémissante vinaigrée.","Servir les œufs sur une tranche de pain grillé, nappés de sauce au vin."]},
{nom:"Poulet vallée d'Auge",cat:'Plat',portions:4,temps:50,cuisine:'Française',saison:["Automne"],difficulte:'Moyen',ingredients:[ing("Cuisses de poulet",4,"pièces",BO),ing("Pommes",3,"pièces",FL),ing("Crème fraîche",20,"cl",CR),ing("Cidre",20,"cl",EP),ing("Échalote",2,"pièces",FL)],etapes:["Faire dorer le poulet dans une cocotte, réserver.","Faire revenir les échalotes, déglacer au cidre.","Remettre le poulet, laisser mijoter 30 min à couvert.","Ajouter les pommes coupées et la crème 10 min avant la fin."]},
{nom:"Salade niçoise",cat:'Entrée',portions:4,temps:20,cuisine:'Française',saison:["Été"],difficulte:'Facile',ingredients:[ing("Thon",280,"g",EP),ing("Tomates",3,"pièces",FL),ing("Œufs",3,"pièces",CR),ing("Haricots verts",200,"g",SU),ing("Olives noires",80,"g",EP),ing("Anchois",6,"filets",EP)],etapes:["Cuire les œufs durs et les haricots verts.","Couper les tomates en quartiers.","Disposer tous les ingrédients dans un saladier.","Assaisonner d'huile d'olive et de vinaigre."]},
{nom:"Poêlée de rognons à la moutarde",cat:'Plat',portions:4,temps:25,cuisine:'Française',saison:["Toute saison"],difficulte:'Difficile',ingredients:[ing("Rognons de veau",500,"g",BO),ing("Moutarde",2,"c.à.s",EP),ing("Crème fraîche",15,"cl",CR),ing("Échalote",2,"pièces",FL),ing("Riz",300,"g",EP)],etapes:["Couper les rognons en morceaux, les saisir à feu vif 3 min.","Réserver, faire revenir les échalotes.","Ajouter la moutarde et la crème, remettre les rognons brièvement.","Servir avec du riz."]},
{nom:"Rillettes de porc maison",cat:'Entrée',portions:6,temps:180,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Difficile',ingredients:[ing("Poitrine de porc",1,"kg",BO),ing("Saindoux",100,"g",BO),ing("Thym",1,"branche",FL),ing("Ail",2,"gousses",FL),ing("Pain de campagne",8,"tranches",BL)],etapes:["Couper la poitrine en morceaux, la placer dans une cocotte avec le saindoux, le thym et l'ail.","Cuire à couvert et à feu très doux 3h jusqu'à ce que la viande s'effiloche.","Égoutter, effilocher la viande à la fourchette, saler.","Réserver au frais dans des pots, servir avec du pain."]},
{nom:"Tian de légumes provençal",cat:'Plat',portions:4,temps:55,cuisine:'Méditerranéenne',saison:["Été"],difficulte:'Moyen',ingredients:[ing("Courgettes",2,"pièces",FL),ing("Aubergine",1,"pièce",FL),ing("Tomates",3,"pièces",FL),ing("Ail",2,"gousses",FL),ing("Thym",1,"branche",FL)],etapes:["Préchauffer le four à 180°C. Couper tous les légumes en fines rondelles.","Les disposer en les intercalant debout dans un plat.","Parsemer d'ail émincé, de thym et d'un filet d'huile d'olive.","Enfourner 45 min jusqu'à ce que les légumes soient fondants."]},
{nom:"Poulet à la grecque au four",cat:'Plat',portions:4,temps:60,cuisine:'Méditerranéenne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Cuisses de poulet",4,"pièces",BO),ing("Pommes de terre",600,"g",FL),ing("Citron",2,"pièces",FL),ing("Origan",1,"pincée",EP),ing("Ail",3,"gousses",FL)],etapes:["Préchauffer le four à 200°C. Couper les pommes de terre en quartiers.","Disposer le poulet et les pommes de terre dans un plat, arroser de jus de citron, d'huile et d'ail écrasé.","Saupoudrer d'origan.","Enfourner 50 min en retournant à mi-cuisson."]},
{nom:"Pastilla au poulet",cat:'Plat',portions:6,temps:70,cuisine:'Méditerranéenne',saison:["Automne","Hiver"],difficulte:'Difficile',ingredients:[ing("Feuilles de brick",8,"pièces",EP),ing("Cuisses de poulet",4,"pièces",BO),ing("Amandes effilées",60,"g",EP),ing("Cannelle",1,"pincée",EP),ing("Oignon",1,"pièce",FL),ing("Sucre glace",2,"c.à.s",EP)],etapes:["Cuire le poulet avec l'oignon émincé et la cannelle 30 min, effilocher.","Préchauffer le four à 190°C. Faire dorer les amandes à sec.","Superposer les feuilles de brick en rosace dans un moule, garnir de poulet et d'amandes, refermer.","Enfourner 20 min, saupoudrer de sucre glace et de cannelle avant de servir."]},

/* ============ STATE ============ */
let state=null;
function defaultState(){
  return{recettes:SEED.map((r,i)=>({id:'seed'+i,...r})),planning:{},courses:[],personnes:2,updatedAt:Date.now()};
}
function load(){
  try{const raw=localStorage.getItem('foodoala');state=raw?JSON.parse(raw):defaultState();}
  catch(e){state=defaultState();}
  if(!state.courses)state.courses=[];
  if(!state.planning)state.planning={};
  if(!state.personnes)state.personnes=2;
}
function save(){
  state.updatedAt=Date.now();
  localStorage.setItem('foodoala',JSON.stringify(state));
  if(driveToken)driveAutoSave();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._to);t._to=setTimeout(()=>t.style.display='none',2200);}

/* ============ NAV ============ */

  document.getElementById('p-'+p).classList.add('active');

  btn.classList.add('active');
  window.scrollTo(0,0);
}

/* ============ SEMAINE ============ */
let weekOffset=0;
function mondayOf(offset){
  const d=new Date();const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day+offset*7);d.setHours(0,0,0,0);return d;
}
function weekKey(offset){
  const m=mondayOf(offset);
  const t=new Date(m);t.setDate(t.getDate()+3);
  const jan4=new Date(t.getFullYear(),0,4);
  const wk=Math.round(((t-jan4)/864e5+((jan4.getDay()+6)%7))/7)+1;
  return t.getFullYear()+'-W'+String(wk).padStart(2,'0');
}
function chWeek(d){weekOffset+=d;renderWeek();}
function fmtD(d){return d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0');}
function renderWeek(){
  const key=weekKey(weekOffset),mon=mondayOf(weekOffset),sun=new Date(mon);sun.setDate(sun.getDate()+6);
  document.getElementById('wkLbl').textContent='Semaine '+key.split('W')[1]+(weekOffset===0?' · cette semaine':'');
  document.getElementById('wkDates').textContent=fmtD(mon)+' → '+fmtD(sun);
  const plan=state.planning[key]||{};
  const today=new Date();today.setHours(0,0,0,0);
  let html='';
  for(let d=0;d<7;d++){
    const dd=new Date(mon);dd.setDate(dd.getDate()+d);
    const isToday=dd.getTime()===today.getTime();
    html+=`<div class="day${isToday?' today':''}"><div class="dayhead">${JOURS[d]} ${fmtD(dd)}</div>`;
    for(const rep of['midi','soir']){
      const rid=plan[d+'_'+rep];
      const rec=rid?state.recettes.find(r=>r.id===rid):null;
      html+=`<div class="meal"><span class="mlbl">${rep}</span>
      <button class="msel${rec?'':' empty'}" onclick="openPick('${key}','${d}_${rep}')">${rec?rec.nom:'— choisir un plat —'}</button>
      ${rec?`<button class="mx" onclick="unset('${key}','${d}_${rep}')">✕</button>`:''}</div>`;
    }
    html+='</div>';
  }
  document.getElementById('weekList').innerHTML=html;
}
function unset(key,slot){delete state.planning[key][slot];save();renderWeek();}

/* pick modal */
let pickTarget=null;
function openPick(key,slot){pickTarget={key,slot};document.getElementById('mPickSearch').value='';renderPick('');document.getElementById('mPick').classList.add('open');}
function closePick(){document.getElementById('mPick').classList.remove('open');}
function renderPick(q){
  q=(q||'').toLowerCase();
  const list=state.recettes.filter(r=>r.nom.toLowerCase().includes(q)).sort((a,b)=>a.nom.localeCompare(b.nom));
  document.getElementById('mPickList').innerHTML=list.map(r=>
    `<div class="rcard" onclick="pick('${r.id}')"><div><div class="rn">${r.nom}</div><div class="rm">${r.temps?r.temps+' min · ':''}${r.ingredients.length} ingrédients</div></div><span class="rcat">${r.cat}</span></div>`
  ).join('')||'<div class="empty">Aucune recette</div>';
}
function pick(id){
  if(!state.planning[pickTarget.key])state.planning[pickTarget.key]={};
  state.planning[pickTarget.key][pickTarget.slot]=id;
  save();closePick();renderWeek();
}

/* ============ RECETTES ============ */
let catFilter='Toutes';
let activeFilters={cuisine:[],saison:[],difficulte:[]};
function renderCatChips(){
  const cats=['Toutes','Plat','Entrée','Dessert','Petit-déj'];
  document.getElementById('catChips').innerHTML=cats.map(c=>
    `<button class="chip${c===catFilter?' active':''}" onclick="catFilter='${c}';renderCatChips();renderRecettes()">${c}</button>`).join('');
}
function renderRecettes(){
  const q=document.getElementById('rSearch').value.toLowerCase();
  const list=state.recettes.filter(r=>
    (catFilter==='Toutes'||r.cat===catFilter)&&
    r.nom.toLowerCase().includes(q)&&
    (!activeFilters.cuisine.length||activeFilters.cuisine.includes(r.cuisine))&&
    (!activeFilters.saison.length||(r.saison||['Toute saison']).some(s=>activeFilters.saison.includes(s)))&&
    (!activeFilters.difficulte.length||activeFilters.difficulte.includes(r.difficulte))
  ).sort((a,b)=>a.nom.localeCompare(b.nom));
  document.getElementById('recCount').textContent=list.length+' recette'+(list.length>1?'s':'');
  document.getElementById('recList').innerHTML=list.map(r=>
    `<div class="rcard" onclick="openDetail('${r.id}')"><div><div class="rn">${r.nom}</div><div class="rm">${r.portions} portions${r.temps?' · '+r.temps+' min':''}${r.difficulte?' · '+r.difficulte:''}${r.cuisine?' · '+r.cuisine:''}</div></div><span class="rcat">${r.cat}</span></div>`
  ).join('')||'<div class="empty">Aucune recette ne correspond</div>';
  const n=activeFilters.cuisine.length+activeFilters.saison.length+activeFilters.difficulte.length;
  const badge=document.getElementById('filterBadge');
  badge.textContent=n;badge.classList.toggle('show',n>0);
  document.getElementById('filterBtn').classList.toggle('hasActive',n>0);
}

/* filtres */
function toggleFilter(group,val){
  const arr=activeFilters[group];
  const i=arr.indexOf(val);
  if(i>-1)arr.splice(i,1);else arr.push(val);
  renderFilterChips();renderRecettes();
}
function renderFilterChips(){
  document.getElementById('fCuisine').innerHTML=CUISINES.map(c=>
    `<button class="chip${activeFilters.cuisine.includes(c)?' active':''}" onclick="toggleFilter('cuisine','${c}')">${c}</button>`).join('');
  document.getElementById('fSaison').innerHTML=SAISONS.map(s=>
    `<button class="chip${activeFilters.saison.includes(s)?' active':''}" onclick="toggleFilter('saison','${s}')">${s}</button>`).join('');
  document.getElementById('fDifficulte').innerHTML=DIFFICULTES.map(d=>
    `<button class="chip${activeFilters.difficulte.includes(d)?' active':''}" onclick="toggleFilter('difficulte','${d}')">${d}</button>`).join('');
}
function openFilters(){renderFilterChips();document.getElementById('mFilters').classList.add('open');}
function closeFilters(){document.getElementById('mFilters').classList.remove('open');}
function resetFilters(){activeFilters={cuisine:[],saison:[],difficulte:[]};renderFilterChips();renderRecettes();}

  document.getElementById('dNom').textContent=r.nom;

/* recipe form */
let editId=null;
function openRecipeForm(id){
  editId=id||null;
  const r=id?state.recettes.find(x=>x.id===id):null;
  document.getElementById('mRecTitle').textContent=r?'Modifier la recette':'Nouvelle recette';
  document.getElementById('fNom').value=r?r.nom:'';
  document.getElementById('fCat').value=r?r.cat:'Plat';
  document.getElementById('fPort').value=r?r.portions:4;
  document.getElementById('fTemps').value=r&&r.temps?r.temps:'';
  document.getElementById('fCuisine').innerHTML=CUISINES.map(c=>`<option${r&&r.cuisine===c?' selected':''}>${c}</option>`).join('');
  document.getElementById('fDifficulteSel').innerHTML=DIFFICULTES.map(d=>`<option${r&&r.difficulte===d?' selected':''}>${d}</option>`).join('');
  document.getElementById('fSaisonSel').innerHTML=SAISONS.map(s=>`<option${r&&r.saison&&r.saison[0]===s?' selected':''}>${s}</option>`).join('');
  document.getElementById('fDel').style.display=r?'block':'none';
  document.getElementById('fIngs').innerHTML='';
  (r?r.ingredients:[{nom:'',qte:'',unite:'',rayon:EP}]).forEach(addIngRow);
  document.getElementById('fEtapes').value=r&&r.etapes?r.etapes.join('\n'):'';
  document.getElementById('mRec').classList.add('open');
}
function closeRec(){document.getElementById('mRec').classList.remove('open');}
function addIngRow(i){
  i=i&&i.nom!==undefined?i:{nom:'',qte:'',unite:'',rayon:EP};
  const div=document.createElement('div');div.className='ingrow';
  div.innerHTML=`<input placeholder="Ingrédient" value="${i.nom||''}" class="inom">
  <input placeholder="Qté" value="${i.qte??''}" class="qte" inputmode="decimal">
  <input placeholder="Unité" value="${i.unite||''}" class="uni">
  <select>${RAYONS.map(r=>`<option${r===i.rayon?' selected':''}>${r}</option>`).join('')}</select>
  <button class="del" onclick="this.parentNode.remove()">✕</button>`;
  document.getElementById('fIngs').appendChild(div);
}
function saveRecipe(){
  const nom=document.getElementById('fNom').value.trim();
  if(!nom){toast('Nom requis');return;}
  const ings=[...document.querySelectorAll('#fIngs .ingrow')].map(row=>({
    nom:row.querySelector('.inom').value.trim(),
    qte:parseFloat(String(row.querySelector('.qte').value).replace(',','.'))||0,
    unite:row.querySelector('.uni').value.trim(),
    rayon:row.querySelector('select').value
  })).filter(i=>i.nom);
  const etapes=document.getElementById('fEtapes').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const rec={id:editId||'r'+Date.now(),nom,cat:document.getElementById('fCat').value,
    portions:parseInt(document.getElementById('fPort').value)||4,
    temps:parseInt(document.getElementById('fTemps').value)||0,
    cuisine:document.getElementById('fCuisine').value,
    difficulte:document.getElementById('fDifficulteSel').value,
    saison:[document.getElementById('fSaisonSel').value],
    ingredients:ings,etapes};
  if(editId){const idx=state.recettes.findIndex(r=>r.id===editId);state.recettes[idx]=rec;}
  else state.recettes.push(rec);
  save();closeRec();renderRecettes();renderWeek();toast('Recette enregistrée');
}
function deleteRecipe(){
  if(!confirm('Supprimer cette recette ?'))return;
  state.recettes=state.recettes.filter(r=>r.id!==editId);
  for(const wk in state.planning)for(const slot in state.planning[wk])
    if(state.planning[wk][slot]===editId)delete state.planning[wk][slot];
  save();closeRec();renderRecettes();renderWeek();toast('Recette supprimée');
}

/* ============ COURSES ============ */
function genCourses(){
  const key=weekKey(weekOffset),plan=state.planning[key]||{};
  const agg={};
  for(const slot in plan){
    const rec=state.recettes.find(r=>r.id===plan[slot]);
    if(!rec)continue;
    const ratio=state.personnes/(rec.portions||4);
    for(const i of rec.ingredients){
      const k=(i.nom+'|'+i.unite).toLowerCase();
      if(!agg[k])agg[k]={nom:i.nom,unite:i.unite,rayon:i.rayon,qte:0};
      agg[k].qte+=i.qte*ratio;
    }
  }
  const manual=state.courses.filter(c=>c.manual);
  state.courses=Object.values(agg).map(a=>({id:'c'+Math.random().toString(36).slice(2),nom:a.nom,
    qte:Math.round(a.qte*100)/100,unite:a.unite,rayon:a.rayon,done:false})).concat(manual);
  save();renderCourses();
  toast(Object.keys(agg).length?'Liste générée ('+key+')':'Aucun plat planifié cette semaine');
}
function renderCourses(){
  const list=state.courses;
  const remaining=list.filter(c=>!c.done).length;
  document.getElementById('cCount').textContent=list.length?remaining+' / '+list.length:'';
  document.getElementById('cClear').style.display=list.some(c=>c.done)?'block':'none';
  if(!list.length){document.getElementById('courseList').innerHTML='<div class="empty">Liste vide.<br>Planifie ta semaine puis génère la liste 🐨</div>';return;}
  let html='';
  for(const ray of RAYONS){
    const items=list.filter(c=>c.rayon===ray);
    if(!items.length)continue;
    html+=`<div class="rayon"><h3>${ray}</h3>`+items.map(c=>
      `<div class="citem${c.done?' done':''}" onclick="togCourse('${c.id}')">
      <span class="cbx">${c.done?'✓':''}</span><span class="cn">${c.nom}</span>
      <span class="cq">${c.qte?c.qte+' '+(c.unite||''):''}</span></div>`).join('')+'</div>';
  }
  document.getElementById('courseList').innerHTML=html;
}
function togCourse(id){const c=state.courses.find(x=>x.id===id);c.done=!c.done;save();renderCourses();}
function addManual(){
  const inp=document.getElementById('cAdd'),v=inp.value.trim();
  if(!v)return;
  state.courses.push({id:'c'+Date.now(),nom:v,qte:0,unite:'',rayon:'Autre',done:false,manual:true});
  inp.value='';save();renderCourses();
}
function clearDone(){state.courses=state.courses.filter(c=>!c.done);save();renderCourses();}

  a.download='foodoala_export_'+new Date().toISOString().slice(0,10)+'.json';a.click();

function importJson(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{state=JSON.parse(rd.result);save();refreshAll();toast('Données importées');}catch(e){toast('Fichier invalide');}};
  rd.readAsText(f);inp.value='';
}

/* ============ GOOGLE DRIVE ============ */
let driveToken=null,tokenClient=null,driveFileId=null,autoTo=null;
function initTokenClient(){
  if(tokenClient)return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
    callback:t=>{driveToken=t.access_token;
      localStorage.setItem('foodoala_drive_connected','1');
      document.getElementById('syncDot').classList.add('on');
      document.getElementById('syncStatus').textContent='Connecté ✓';
      document.getElementById('btnConnect').textContent='Reconnecter';
      driveLoad(true);},
    error_callback:()=>{/* silent attempt failed, stay disconnected */}
  });
}
function driveConnect(){
  if(!window.google){toast('Google non chargé');return;}
  initTokenClient();
  tokenClient.requestAccessToken();
}
function gisLoaded(){
  if(!window.google)return;
  initTokenClient();
  if(localStorage.getItem('foodoala_drive_connected')==='1'){
    // reconnexion rapide et silencieuse, sans popup
    tokenClient.requestAccessToken({prompt:''});
  }
}
async function driveFind(){
  if(driveFileId)return driveFileId;
  const r=await fetch("https://www.googleapis.com/drive/v3/files?q=name='"+DRIVE_FILE+"' and trashed=false&fields=files(id)",
    {headers:{Authorization:'Bearer '+driveToken}});
  const j=await r.json();
  if(j.files&&j.files.length)driveFileId=j.files[0].id;
  return driveFileId;
}
async function driveSave(manual){
  if(!driveToken){if(manual)toast('Connecte Drive d’abord');return;}
  const dot=document.getElementById('syncDot');dot.classList.add('busy');
  try{
    const id=await driveFind();
    const meta={name:DRIVE_FILE,mimeType:'application/json'};
    const body='--b\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(meta)+
      '\r\n--b\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(state)+'\r\n--b--';
    const url=id?'https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=multipart'
                :'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const r=await fetch(url,{method:id?'PATCH':'POST',
      headers:{Authorization:'Bearer '+driveToken,'Content-Type':'multipart/related; boundary=b'},body});
    const j=await r.json();driveFileId=j.id||driveFileId;
    if(manual)toast('Sauvegardé sur Drive ✓');
  }catch(e){if(manual)toast('Erreur Drive');}
  dot.classList.remove('busy');
}
async function driveLoad(silent){
  if(!driveToken){toast('Connecte Drive d’abord');return;}
  const dot=document.getElementById('syncDot');dot.classList.add('busy');
  try{
    const id=await driveFind();
    if(!id){if(!silent)toast('Aucune donnée sur Drive');await driveSave(false);}
    else{
      const r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',
        {headers:{Authorization:'Bearer '+driveToken}});
      const remote=await r.json();
      if(remote&&remote.recettes){
        if(!silent||((remote.updatedAt||0)>(state.updatedAt||0))){
          state=remote;localStorage.setItem('foodoala',JSON.stringify(state));refreshAll();
          if(!silent)toast('Chargé depuis Drive ✓');
        }else driveSave(false);
      }
    }
  }catch(e){if(!silent)toast('Erreur Drive');}
  dot.classList.remove('busy');
}
