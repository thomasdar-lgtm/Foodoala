<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Foodoala</title>
<meta name="theme-color" content="#00071a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#00071a; --bg2:#0a1330; --bg3:#121d42; --line:#1e2a55;
  --txt:#eef2ff; --txt2:#8fa0cf;
  --red:#EE1515; --yellow:#FFCB05; --green:#3ddc84;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Raleway',sans-serif;min-height:100%}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-weight:900;font-size:1.5rem;letter-spacing:.5px;display:flex;align-items:baseline;gap:0}
header h1 .fd{color:var(--red)}
header h1 .ol{color:var(--yellow)}
header h1 .ver{font-size:.62rem;font-weight:800;color:var(--txt2);letter-spacing:.5px;margin-left:8px}
header .logo{width:48px;height:48px;border-radius:12px;object-fit:cover;flex-shrink:0}
header .hspacer{flex:1}
header .gearBtn{background:var(--bg2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:11px;font-size:1.05rem;display:flex;align-items:center;justify-content:center;position:relative}
#syncDot{width:9px;height:9px;border-radius:50%;background:var(--txt2);position:absolute;top:-3px;right:-3px;border:2px solid var(--bg);transition:background .3s}
#syncDot.on{background:var(--green)}
#syncDot.busy{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.page{display:none;padding:0 16px 24px;max-width:760px;margin:0 auto}
.page.active{display:block}
h2{font-weight:900;font-size:1.1rem;margin:14px 0 10px;text-transform:uppercase;letter-spacing:1px}
h2 small{color:var(--txt2);font-weight:600;text-transform:none;letter-spacing:0}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
button{font-family:inherit;font-weight:800;border:none;border-radius:12px;cursor:pointer;font-size:.9rem}
.btn{background:var(--red);color:#fff;padding:11px 16px;width:100%;margin-top:8px}
.btn.sec{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
.btn.yel{background:var(--yellow);color:#00071a}
.btn.sm{width:auto;padding:8px 12px;font-size:.8rem}
input,select,textarea{font-family:inherit;background:var(--bg3);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:.95rem;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);border-color:transparent}
label{font-size:.75rem;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;display:block;margin:10px 0 4px}
/* NAV */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--txt2);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.65rem;font-weight:800;border-radius:0}
nav button .ni{font-size:1.3rem;line-height:1}
nav button.active{color:var(--yellow)}
/* SEMAINE */
.weeknav{display:flex;align-items:center;gap:8px;margin:12px 0}
.weeknav button{background:var(--bg3);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:10px;font-size:1rem}
.weeknav .wk{flex:1;text-align:center;font-weight:900}
.weeknav .wk small{display:block;color:var(--txt2);font-weight:600;font-size:.7rem}
.day{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.day.today{border-color:var(--yellow)}
.dayhead{padding:8px 14px;font-weight:900;font-size:.85rem;text-transform:uppercase;letter-spacing:1px;color:var(--yellow);background:var(--bg3)}
.meal{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.meal .mlbl{font-size:.7rem;font-weight:800;color:var(--txt2);width:38px;text-transform:uppercase}
.meal .msel{flex:1;background:none;border:none;color:var(--txt);text-align:left;font-weight:700;font-size:.9rem;padding:4px 0}
.meal .msel.empty{color:var(--txt2);font-weight:600;font-style:italic}
.meal .mx{background:none;color:var(--txt2);font-size:1rem;padding:4px 6px}
/* RECETTES */
.searchrow{display:flex;gap:8px;margin:12px 0}
.searchrow #filterBtn{width:auto;padding:8px 12px;position:relative}
.searchrow #filterBtn.hasActive{background:var(--yellow);color:#00071a;border-color:var(--yellow)}
#filterBadge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:.6rem;font-weight:900;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px}
#filterBadge.show{display:flex}
.fgroup{margin-bottom:16px}
.fgroup h4{font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);margin-bottom:8px}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{background:var(--bg3);border:1px solid var(--line);color:var(--txt2);padding:6px 12px;border-radius:20px;font-size:.75rem;font-weight:800;white-space:nowrap}
.chip.active{background:var(--yellow);color:#00071a;border-color:var(--yellow)}
.rcard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rcard .rn{font-weight:800}
.rcard .rm{font-size:.72rem;color:var(--txt2);font-weight:600;margin-top:2px}
.rcard .rcat{font-size:.65rem;font-weight:900;padding:3px 8px;border-radius:8px;background:var(--bg3);color:var(--yellow);text-transform:uppercase;white-space:nowrap}
/* FICHE RECETTE (detail) */
.rdHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.rdMeta{display:flex;gap:14px;color:var(--txt2);font-size:.78rem;font-weight:700;margin:6px 0 16px;flex-wrap:wrap}
.rdMeta b{color:var(--yellow)}
.rdSection h3{font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--yellow);margin:16px 0 8px}
.rdIng{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.rdIng .qn{color:var(--txt2);font-weight:700;white-space:nowrap;margin-left:10px}
.rdStep{display:flex;gap:12px;margin-bottom:14px}
.rdStep .num{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--red);color:#fff;font-weight:900;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.rdStep p{font-size:.9rem;line-height:1.45;padding-top:2px}
.inglist{margin:8px 0}
.ingrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.ingrow input.qte{width:64px}
.ingrow input.uni{width:70px}
.ingrow select{width:110px}
.ingrow .del{background:none;color:var(--red);font-size:1.1rem;padding:0 6px}
/* COURSES */
.rayon{margin-bottom:14px}
.rayon h3{font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--yellow);margin-bottom:6px}
.citem{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.citem .cbx{width:20px;height:20px;border-radius:6px;border:2px solid var(--txt2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.citem.done .cbx{background:var(--green);border-color:var(--green);color:#00071a}
.citem.done .cn{text-decoration:line-through;color:var(--txt2)}
.citem .cn{font-weight:700;flex:1;font-size:.9rem}
.citem .cq{font-size:.8rem;color:var(--txt2);font-weight:700}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.addrow button{width:auto;margin:0;padding:0 16px}
/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,7,26,.85);z-index:50;overflow-y:auto;padding:20px 14px}
.modal.open{display:block}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);max-width:560px;margin:0 auto;padding:18px}
.mbox h2{margin-top:0}
.mrow{display:flex;gap:8px}
.mrow>div{flex:1}
.picklist{max-height:55vh;overflow-y:auto}
.empty{color:var(--txt2);text-align:center;padding:30px 0;font-weight:600}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--yellow);color:#00071a;font-weight:900;padding:10px 18px;border-radius:12px;z-index:60;display:none;font-size:.85rem}
.vtag{text-align:center;color:var(--txt2);font-size:.7rem;font-weight:700;margin-top:18px}
</style>
</head>
<body>

<header>
  <img class="logo" src="icons/icon-192.png" alt="Foodoala">
  <h1><span class="fd">Food</span><span class="ol">oala</span><span class="ver">v<span id="verTag"></span></span></h1>
  <div class="hspacer"></div>
  <button class="gearBtn" onclick="openSettings()"><span id="syncDot"></span>⚙️</button>
</header>

<!-- SEMAINE -->
<div class="page active" id="p-semaine">
  <div class="weeknav">
    <button onclick="chWeek(-1)">‹</button>
    <div class="wk"><span id="wkLbl"></span><small id="wkDates"></small></div>
    <button onclick="chWeek(1)">›</button>
  </div>
  <div id="weekList"></div>
</div>

<!-- RECETTES -->
<div class="page" id="p-recettes">
  <div class="searchrow">
    <input id="rSearch" placeholder="Rechercher une recette…" oninput="renderRecettes()">
    <button class="btn sec sm" id="filterBtn" onclick="openFilters()">⚙️<span id="filterBadge"></span></button>
    <button class="btn yel sm" onclick="openRecipeForm()">＋</button>
  </div>
  <div class="chiprow" id="catChips"></div>
  <div id="recCount" style="color:var(--txt2);font-size:.75rem;font-weight:700;margin:0 0 8px"></div>
  <div id="recList"></div>
</div>

<!-- COURSES -->
<div class="page" id="p-courses">
  <h2 style="display:flex;justify-content:space-between;align-items:center">Liste de courses <small id="cCount"></small></h2>
  <button class="btn" onclick="genCourses()">🛒 Générer depuis la semaine</button>
  <div class="addrow">
    <input id="cAdd" placeholder="Ajouter un article…" onkeydown="if(event.key==='Enter')addManual()">
    <button class="btn sec" onclick="addManual()">＋</button>
  </div>
  <div id="courseList" style="margin-top:14px"></div>
  <button class="btn sec" id="cClear" onclick="clearDone()" style="display:none">Retirer les articles cochés</button>
</div>

<!-- MODAL REGLAGES -->
<div class="modal" id="mSettings" onclick="if(event.target===this)closeSettings()">
  <div class="mbox">
    <h2>Réglages</h2>
    <div class="card">
      <label>Nombre de personnes (portions)</label>
      <input type="number" id="setPers" min="1" max="12" onchange="setPersonnes(this.value)">
    </div>
    <div class="card">
      <label>Google Drive</label>
      <div id="syncStatus" style="font-size:.85rem;color:var(--txt2);font-weight:600;margin-bottom:4px">Non connecté</div>
      <button class="btn yel" id="btnConnect" onclick="driveConnect()">Connecter Google Drive</button>
      <button class="btn sec" onclick="driveSave(true)">⬆️ Sauvegarder sur Drive</button>
      <button class="btn sec" onclick="driveLoad()">⬇️ Charger depuis Drive</button>
    </div>
    <div class="card">
      <button class="btn sec" onclick="exportJson()">Exporter les données (JSON)</button>
      <input type="file" id="impFile" accept=".json" style="display:none" onchange="importJson(this)">
      <button class="btn sec" onclick="document.getElementById('impFile').click()">Importer des données (JSON)</button>
    </div>
    <div class="vtag">Foodoala v<span id="verTag2"></span> · Thomas & Cindy</div>
    <button class="btn sec" onclick="closeSettings()">Fermer</button>
  </div>
</div>

<nav>
  <button class="active" onclick="go('semaine',this)"><span class="ni">📅</span>Semaine</button>
  <button onclick="go('recettes',this)"><span class="ni">📖</span>Recettes</button>
  <button onclick="go('courses',this)"><span class="ni">🛒</span>Courses</button>
</nav>

<!-- MODAL filtres recettes -->
<div class="modal" id="mFilters" onclick="if(event.target===this)closeFilters()">
  <div class="mbox">
    <h2>Filtrer les recettes</h2>
    <div class="fgroup"><h4>Cuisine</h4><div class="chiprow" id="fCuisine" style="overflow:visible;flex-wrap:wrap"></div></div>
    <div class="fgroup"><h4>Saison</h4><div class="chiprow" id="fSaison" style="overflow:visible;flex-wrap:wrap"></div></div>
    <div class="fgroup"><h4>Difficulté</h4><div class="chiprow" id="fDifficulte" style="overflow:visible;flex-wrap:wrap"></div></div>
    <button class="btn yel" onclick="closeFilters()">Voir les résultats</button>
    <button class="btn sec" onclick="resetFilters()">Réinitialiser</button>
  </div>
</div>

<!-- MODAL choix recette -->
<div class="modal" id="mPick" onclick="if(event.target===this)closePick()">
  <div class="mbox">
    <h2 id="mPickTitle">Choisir une recette</h2>
    <input placeholder="Rechercher…" oninput="renderPick(this.value)" id="mPickSearch">
    <div class="picklist" id="mPickList" style="margin-top:10px"></div>
    <button class="btn sec" onclick="closePick()">Annuler</button>
  </div>
</div>

<!-- MODAL fiche recette (lecture) -->
<div class="modal" id="mDetail" onclick="if(event.target===this)closeDetail()">
  <div class="mbox">
    <div class="rdHead"><h2 id="dNom" style="margin:0"></h2><span class="rcat" id="dCat"></span></div>
    <div class="rdMeta">
      <span>⏱ <b id="dTemps"></b></span>
      <span>🍽 <b id="dPortions"></b> portions</span>
      <span>🌍 <b id="dCuisine"></b></span>
      <span>📊 <b id="dDifficulte"></b></span>
      <span>🍂 <b id="dSaison"></b></span>
    </div>
    <div class="rdSection">
      <h3>Ingrédients</h3>
      <div id="dIngList"></div>
    </div>
    <div class="rdSection">
      <h3>Étapes</h3>
      <div id="dStepsList"></div>
    </div>
    <button class="btn yel" id="dEditBtn" onclick="editFromDetail()">✏️ Modifier la recette</button>
    <button class="btn sec" onclick="closeDetail()">Fermer</button>
  </div>
</div>

<!-- MODAL recette (édition) -->
<div class="modal" id="mRec" onclick="if(event.target===this)closeRec()">
  <div class="mbox">
    <h2 id="mRecTitle">Nouvelle recette</h2>
    <label>Nom</label><input id="fNom">
    <div class="mrow">
      <div><label>Catégorie</label>
        <select id="fCat"><option>Plat</option><option>Entrée</option><option>Dessert</option><option>Petit-déj</option></select></div>
      <div><label>Portions de base</label><input type="number" id="fPort" value="4" min="1"></div>
      <div><label>Temps (min)</label><input type="number" id="fTemps" min="0"></div>
    </div>
    <div class="mrow">
      <div><label>Cuisine</label>
        <select id="fCuisine"></select></div>
      <div><label>Difficulté</label>
        <select id="fDifficulteSel"></select></div>
      <div><label>Saison</label>
        <select id="fSaisonSel"></select></div>
    </div>
    <label>Ingrédients</label>
    <div class="inglist" id="fIngs"></div>
    <button class="btn sec sm" onclick="addIngRow()">＋ Ingrédient</button>
    <label>Étapes (une par ligne)</label>
    <textarea id="fEtapes" rows="6" placeholder="1. Éplucher les légumes…"></textarea>
    <button class="btn yel" onclick="saveRecipe()">Enregistrer</button>
    <button class="btn sec" id="fDel" onclick="deleteRecipe()" style="display:none;color:var(--red)">Supprimer la recette</button>
    <button class="btn sec" onclick="closeRec()">Fermer</button>
  </div>
</div>

<div id="toast"></div>

<script>
const APP_VERSION='2.00';
const RAYONS=['Fruits & Légumes','Boucherie','Poissonnerie','Crèmerie','Épicerie','Boulangerie','Surgelés','Autre'];
const JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const CUISINES=['Française','Italienne','Asiatique','Méditerranéenne','Mexicaine','Autre'];
const SAISONS=['Toute saison','Printemps','Été','Automne','Hiver'];
const DIFFICULTES=['Facile','Moyen','Difficile'];
const CLIENT_ID='794515583920-a9togbole8fr9njjsrjt0f1cq6utaent.apps.googleusercontent.com';
const DRIVE_FILE='foodoala_data.json';

/* ============ SEED RECETTES ============ */
function ing(nom,qte,unite,rayon){return{nom,qte,unite,rayon}}
const FL='Fruits & Légumes',BO='Boucherie',PO='Poissonnerie',CR='Crèmerie',EP='Épicerie',BL='Boulangerie',SU='Surgelés';
const SEED=[
{nom:"Spaghetti bolognaise",cat:'Plat',portions:4,temps:40,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Spaghetti",400,"g",EP),ing("Bœuf haché",400,"g",BO),ing("Tomates pelées",800,"g",EP),ing("Oignon",1,"pièce",FL),ing("Ail",2,"gousses",FL),ing("Carotte",1,"pièce",FL),ing("Parmesan",50,"g",CR)],etapes:["Émincer l'oignon, l'ail et la carotte, puis les faire revenir 5 min dans un filet d'huile.","Ajouter le bœuf haché, saler, poivrer et faire colorer 5 min en émiettant à la fourchette.","Ajouter les tomates pelées, laisser mijoter 25 min à feu doux en remuant de temps en temps.","Cuire les spaghetti al dente dans l'eau bouillante salée, égoutter.","Servir les pâtes nappées de sauce, saupoudrées de parmesan."]},
{nom:"Pâtes carbonara",cat:'Plat',portions:4,temps:20,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Spaghetti",400,"g",EP),ing("Lardons",200,"g",BO),ing("Œufs",4,"pièces",CR),ing("Parmesan",80,"g",CR),ing("Poivre noir",1,"pincée",EP)],etapes:["Cuire les spaghetti al dente dans l'eau bouillante salée.","Pendant ce temps, faire revenir les lardons à sec dans une poêle jusqu'à ce qu'ils soient dorés.","Battre les œufs avec le parmesan et une bonne dose de poivre.","Égoutter les pâtes en gardant un peu d'eau de cuisson, les mélanger hors du feu aux lardons puis à l'appareil œufs-parmesan.","Servir aussitôt, la chaleur des pâtes suffit à cuire l'appareil."]},
{nom:"Poulet rôti & pommes de terre",cat:'Plat',portions:4,temps:80,cuisine:'Française',saison:["Toute saison"],difficulte:'Difficile',ingredients:[ing("Poulet fermier",1,"pièce",BO),ing("Pommes de terre",1,"kg",FL),ing("Ail",4,"gousses",FL),ing("Thym",1,"branche",FL),ing("Beurre",30,"g",CR)],etapes:["Préchauffer le four à 200°C.","Badigeonner le poulet de beurre, saler, poivrer, glisser l'ail et le thym à l'intérieur.","Couper les pommes de terre en gros morceaux et les disposer autour du poulet dans un plat.","Enfourner 1h15, en arrosant régulièrement avec le jus de cuisson.","Vérifier la cuisson (jus clair à la pointe du couteau) avant de servir."]},
{nom:"Quiche lorraine",cat:'Plat',portions:4,temps:50,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Pâte brisée",1,"pièce",CR),ing("Lardons",200,"g",BO),ing("Œufs",3,"pièces",CR),ing("Crème fraîche",20,"cl",CR),ing("Gruyère râpé",100,"g",CR)],etapes:["Préchauffer le four à 180°C et foncer un moule avec la pâte brisée.","Faire revenir les lardons quelques minutes à sec, puis les répartir sur la pâte.","Battre les œufs avec la crème fraîche, saler légèrement, poivrer.","Verser l'appareil sur les lardons, parsemer de gruyère râpé.","Enfourner 35 min jusqu'à ce que la quiche soit dorée."]},
{nom:"Gratin dauphinois",cat:'Plat',portions:4,temps:75,cuisine:'Française',saison:["Hiver"],difficulte:'Difficile',ingredients:[ing("Pommes de terre",1.2,"kg",FL),ing("Crème liquide",40,"cl",CR),ing("Lait",20,"cl",CR),ing("Ail",2,"gousses",FL),ing("Muscade",1,"pincée",EP)],etapes:["Préchauffer le four à 180°C. Éplucher et couper les pommes de terre en fines rondelles.","Frotter un plat à gratin avec l'ail, puis y disposer les pommes de terre.","Mélanger la crème, le lait, sel, poivre et muscade, verser sur les pommes de terre.","Enfourner 1h à 1h15 jusqu'à ce que le dessus soit doré et les pommes de terre fondantes."]},
{nom:"Steak haché & purée",cat:'Plat',portions:4,temps:30,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Steaks hachés",4,"pièces",BO),ing("Pommes de terre",1,"kg",FL),ing("Beurre",50,"g",CR),ing("Lait",15,"cl",CR)],etapes:["Cuire les pommes de terre épluchées et coupées 20 min dans l'eau bouillante salée.","Les écraser en purée avec le beurre et le lait chaud, saler, poivrer.","Cuire les steaks hachés à la poêle selon la cuisson désirée, 2 à 4 min de chaque côté.","Servir immédiatement avec la purée."]},
{nom:"Saumon, riz & brocolis",cat:'Plat',portions:4,temps:30,cuisine:'Autre',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Pavés de saumon",4,"pièces",PO),ing("Riz",300,"g",EP),ing("Brocoli",1,"pièce",FL),ing("Citron",1,"pièce",FL)],etapes:["Cuire le riz selon les instructions du paquet.","Cuire le brocoli en fleurettes à la vapeur 8 à 10 min.","Saisir les pavés de saumon à la poêle 4 min de chaque côté, arroser de jus de citron.","Dresser le riz, le brocoli et le saumon ensemble."]},
{nom:"Poulet curry coco & riz",cat:'Plat',portions:4,temps:35,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",600,"g",BO),ing("Lait de coco",40,"cl",EP),ing("Curry en poudre",2,"c.à.s",EP),ing("Riz basmati",300,"g",EP),ing("Oignon",1,"pièce",FL)],etapes:["Émincer l'oignon et le faire revenir dans un peu d'huile.","Couper le poulet en morceaux, l'ajouter et le faire dorer 5 min.","Saupoudrer de curry, mélanger, puis verser le lait de coco.","Laisser mijoter 15 min à couvert. Cuire le riz basmati en parallèle.","Servir le curry sur le riz."]},
{nom:"Chili con carne",cat:'Plat',portions:4,temps:45,cuisine:'Mexicaine',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Bœuf haché",500,"g",BO),ing("Haricots rouges",400,"g",EP),ing("Tomates concassées",800,"g",EP),ing("Maïs",140,"g",EP),ing("Oignon",1,"pièce",FL),ing("Épices chili",1,"sachet",EP),ing("Riz",300,"g",EP)],etapes:["Faire revenir l'oignon émincé, ajouter le bœuf haché et le faire colorer.","Ajouter les épices, mélanger 1 min pour les torréfier légèrement.","Verser les tomates concassées, les haricots rouges égouttés et le maïs.","Laisser mijoter 30 min à feu doux en remuant de temps en temps.","Servir avec du riz blanc."]},
{nom:"Lasagnes maison",cat:'Plat',portions:6,temps:70,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Difficile',ingredients:[ing("Feuilles de lasagne",250,"g",EP),ing("Bœuf haché",600,"g",BO),ing("Tomates pelées",800,"g",EP),ing("Béchamel",50,"cl",EP),ing("Gruyère râpé",150,"g",CR),ing("Oignon",1,"pièce",FL)],etapes:["Préchauffer le four à 190°C. Faire revenir l'oignon puis le bœuf haché, ajouter les tomates et laisser mijoter 20 min.","Dans un plat, alterner couches de feuilles de lasagne, sauce bolognaise et béchamel.","Terminer par une couche de béchamel et le gruyère râpé.","Enfourner 35 min jusqu'à ce que le dessus soit gratiné."]},
{nom:"Omelette champignons & salade",cat:'Plat',portions:2,temps:15,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Œufs",6,"pièces",CR),ing("Champignons de Paris",250,"g",FL),ing("Salade verte",1,"pièce",FL),ing("Beurre",20,"g",CR)],etapes:["Émincer et faire revenir les champignons dans le beurre jusqu'à évaporation de l'eau de végétation.","Battre les œufs, saler, poivrer, verser sur les champignons.","Cuire à feu moyen en repliant les bords vers le centre jusqu'à la cuisson désirée.","Servir avec la salade verte assaisonnée."]},
{nom:"Croque-monsieur",cat:'Plat',portions:2,temps:15,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Pain de mie",8,"tranches",BL),ing("Jambon blanc",4,"tranches",BO),ing("Gruyère râpé",120,"g",CR),ing("Beurre",30,"g",CR)],etapes:["Beurrer les tranches de pain de mie sur une face.","Garnir 4 tranches de jambon et de gruyère, recouvrir des 4 autres tranches.","Faire dorer à la poêle ou au four 8 à 10 min de chaque côté jusqu'à ce que le fromage fonde."]},
{nom:"Salade César",cat:'Plat',portions:2,temps:20,cuisine:'Autre',saison:["Été"],difficulte:'Facile',ingredients:[ing("Salade romaine",1,"pièce",FL),ing("Filets de poulet",300,"g",BO),ing("Parmesan",40,"g",CR),ing("Croûtons",80,"g",EP),ing("Sauce César",1,"pot",EP)],etapes:["Cuire les filets de poulet à la poêle 6 à 8 min de chaque côté, puis les émincer.","Laver et couper la salade romaine.","Mélanger la salade, le poulet, les croûtons et le parmesan en copeaux.","Napper de sauce César au moment de servir."]},
{nom:"Risotto aux champignons",cat:'Plat',portions:4,temps:40,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Riz arborio",320,"g",EP),ing("Champignons de Paris",400,"g",FL),ing("Bouillon de volaille",1,"L",EP),ing("Parmesan",60,"g",CR),ing("Oignon",1,"pièce",FL),ing("Vin blanc",10,"cl",EP)],etapes:["Faire revenir l'oignon émincé, ajouter le riz et le nacrer 2 min.","Déglacer au vin blanc, laisser évaporer.","Ajouter le bouillon chaud louche par louche, en remuant, jusqu'à absorption complète (environ 18 min).","En parallèle, faire sauter les champignons émincés à la poêle.","Incorporer les champignons et le parmesan hors du feu, rectifier l'assaisonnement."]},
{nom:"Tartiflette",cat:'Plat',portions:4,temps:60,cuisine:'Française',saison:["Hiver"],difficulte:'Moyen',ingredients:[ing("Pommes de terre",1.2,"kg",FL),ing("Reblochon",1,"pièce",CR),ing("Lardons",200,"g",BO),ing("Oignon",2,"pièces",FL),ing("Crème fraîche",15,"cl",CR)],etapes:["Préchauffer le four à 200°C. Cuire les pommes de terre en robe des champs 20 min, puis les éplucher et les couper en rondelles.","Faire revenir les oignons émincés et les lardons quelques minutes.","Dans un plat, disposer les pommes de terre, les lardons-oignons et la crème, mélanger.","Couper le reblochon en deux dans l'épaisseur, le poser croûte vers le haut sur le plat.","Enfourner 25 à 30 min jusqu'à ce que le fromage soit fondu et doré."]},
{nom:"Bœuf bourguignon",cat:'Plat',portions:6,temps:180,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Difficile',ingredients:[ing("Bœuf à braiser",1,"kg",BO),ing("Vin rouge",75,"cl",EP),ing("Carottes",4,"pièces",FL),ing("Champignons de Paris",250,"g",FL),ing("Lardons",150,"g",BO),ing("Oignon",2,"pièces",FL)],etapes:["Faire dorer les morceaux de bœuf sur toutes les faces dans une cocotte, réserver.","Faire revenir les lardons et les oignons émincés dans la même cocotte.","Remettre la viande, saupoudrer d'une cuillère de farine, mélanger.","Verser le vin rouge à hauteur, ajouter les carottes en rondelles, saler, poivrer.","Laisser mijoter à couvert 2h30 à feu doux, ajouter les champignons 20 min avant la fin."]},
{nom:"Blanquette de veau",cat:'Plat',portions:6,temps:120,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Difficile',ingredients:[ing("Veau (épaule)",1,"kg",BO),ing("Carottes",3,"pièces",FL),ing("Champignons de Paris",250,"g",FL),ing("Crème fraîche",20,"cl",CR),ing("Riz",400,"g",EP),ing("Oignon",1,"pièce",FL)],etapes:["Blanchir les morceaux de veau 5 min dans l'eau bouillante, rincer.","Remettre dans une cocotte avec eau à hauteur, oignon et carottes, cuire 1h30 à petits frémissements.","Ajouter les champignons émincés 15 min avant la fin.","Prélever un peu de bouillon, le mélanger à la crème fraîche puis reverser dans la cocotte pour lier la sauce.","Servir avec du riz blanc."]},
{nom:"Poêlée de légumes & œufs",cat:'Plat',portions:2,temps:20,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Poêlée de légumes surgelée",600,"g",SU),ing("Œufs",4,"pièces",CR)],etapes:["Faire revenir la poêlée de légumes surgelée à la poêle 10 à 12 min.","Creuser 4 puits dans les légumes, y casser les œufs.","Couvrir et laisser cuire 5 min jusqu'à ce que les blancs soient pris."]},
{nom:"Pizza maison",cat:'Plat',portions:4,temps:35,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Pâte à pizza",1,"pièce",CR),ing("Sauce tomate",200,"g",EP),ing("Mozzarella",250,"g",CR),ing("Jambon blanc",2,"tranches",BO),ing("Champignons de Paris",150,"g",FL)],etapes:["Préchauffer le four à 220°C. Étaler la pâte sur une plaque.","Napper de sauce tomate, répartir la mozzarella.","Ajouter le jambon en lanières et les champignons émincés.","Enfourner 12 à 15 min jusqu'à ce que la pâte soit dorée."]},
{nom:"Fajitas au poulet",cat:'Plat',portions:4,temps:30,cuisine:'Mexicaine',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",500,"g",BO),ing("Tortillas",8,"pièces",EP),ing("Poivrons",2,"pièces",FL),ing("Oignon",1,"pièce",FL),ing("Épices fajitas",1,"sachet",EP),ing("Crème fraîche",20,"cl",CR)],etapes:["Couper le poulet, les poivrons et l'oignon en lanières.","Faire revenir le poulet à feu vif avec les épices, réserver.","Faire sauter les poivrons et l'oignon 5 min, remettre le poulet.","Réchauffer les tortillas et garnir avec la préparation et la crème fraîche."]},
{nom:"Soupe de légumes",cat:'Entrée',portions:4,temps:40,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Carottes",3,"pièces",FL),ing("Poireaux",2,"pièces",FL),ing("Pommes de terre",400,"g",FL),ing("Courgette",1,"pièce",FL),ing("Bouillon de légumes",1,"cube",EP)],etapes:["Éplucher et couper tous les légumes en morceaux.","Les mettre dans une cocotte, couvrir d'eau, ajouter le bouillon cube.","Cuire 30 min à couvert jusqu'à ce que les légumes soient tendres.","Mixer jusqu'à obtenir une texture lisse, rectifier l'assaisonnement."]},
{nom:"Hachis parmentier",cat:'Plat',portions:4,temps:60,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Bœuf haché",500,"g",BO),ing("Pommes de terre",1,"kg",FL),ing("Oignon",1,"pièce",FL),ing("Gruyère râpé",80,"g",CR),ing("Beurre",40,"g",CR),ing("Lait",15,"cl",CR)],etapes:["Préchauffer le four à 200°C. Cuire les pommes de terre 20 min, en purée avec beurre et lait.","Faire revenir l'oignon émincé puis le bœuf haché, saler, poivrer.","Dans un plat, étaler la viande puis recouvrir de purée.","Parsemer de gruyère râpé et enfourner 20 min jusqu'à coloration."]},
{nom:"Cordon bleu & haricots verts",cat:'Plat',portions:4,temps:25,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Cordons bleus",4,"pièces",BO),ing("Haricots verts",600,"g",SU),ing("Beurre",20,"g",CR)],etapes:["Cuire les cordons bleus à la poêle ou au four selon les instructions du paquet.","Cuire les haricots verts surgelés à la vapeur ou à l'eau bouillante 10 min.","Faire sauter les haricots dans le beurre 2 min avant de servir."]},
{nom:"Cabillaud & purée",cat:'Plat',portions:4,temps:30,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Dos de cabillaud",4,"pièces",PO),ing("Pommes de terre",1,"kg",FL),ing("Beurre",50,"g",CR),ing("Citron",1,"pièce",FL),ing("Lait",15,"cl",CR)],etapes:["Cuire les pommes de terre 20 min, écraser en purée avec beurre et lait.","Cuire les dos de cabillaud à la poêle 4 min de chaque côté ou au four 15 min à 180°C.","Arroser de jus de citron avant de servir avec la purée."]},
{nom:"Wok de nouilles au poulet",cat:'Plat',portions:4,temps:25,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Nouilles chinoises",300,"g",EP),ing("Filets de poulet",400,"g",BO),ing("Légumes pour wok",500,"g",SU),ing("Sauce soja",6,"c.à.s",EP),ing("Ail",2,"gousses",FL)],etapes:["Cuire les nouilles selon les instructions, égoutter.","Faire revenir le poulet coupé en lanières avec l'ail émincé à feu vif.","Ajouter les légumes pour wok, faire sauter 5 min.","Ajouter les nouilles et la sauce soja, mélanger 2 min sur feu vif."]},
{nom:"Ratatouille & semoule",cat:'Plat',portions:4,temps:50,cuisine:'Méditerranéenne',saison:["Été"],difficulte:'Moyen',ingredients:[ing("Aubergine",1,"pièce",FL),ing("Courgettes",2,"pièces",FL),ing("Poivrons",2,"pièces",FL),ing("Tomates",4,"pièces",FL),ing("Oignon",1,"pièce",FL),ing("Semoule",300,"g",EP)],etapes:["Couper tous les légumes en dés.","Faire revenir l'oignon, puis ajouter successivement aubergine, poivrons et courgettes en les faisant dorer.","Ajouter les tomates, saler, poivrer, laisser mijoter 30 min à couvert.","Préparer la semoule selon les instructions du paquet et servir avec la ratatouille."]},
{nom:"Galettes complètes",cat:'Plat',portions:2,temps:20,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Galettes de sarrasin",4,"pièces",CR),ing("Jambon blanc",4,"tranches",BO),ing("Œufs",4,"pièces",CR),ing("Gruyère râpé",100,"g",CR)],etapes:["Faire chauffer une galette dans une poêle légèrement beurrée.","Ajouter une tranche de jambon, du gruyère et casser un œuf au centre.","Replier les bords de la galette et laisser cuire jusqu'à ce que le blanc soit pris.","Répéter pour les autres galettes."]},
{nom:"Salade de pâtes",cat:'Plat',portions:4,temps:20,cuisine:'Italienne',saison:["Été"],difficulte:'Facile',ingredients:[ing("Penne",350,"g",EP),ing("Tomates cerises",250,"g",FL),ing("Mozzarella",250,"g",CR),ing("Thon",280,"g",EP),ing("Olives noires",100,"g",EP)],etapes:["Cuire les penne al dente, égoutter et laisser refroidir.","Couper les tomates cerises en deux et la mozzarella en dés.","Mélanger les pâtes, tomates, mozzarella, thon égoutté et olives.","Assaisonner d'huile d'olive, sel et poivre, réserver au frais avant de servir."]},
{nom:"Couscous poulet & merguez",cat:'Plat',portions:6,temps:70,cuisine:'Méditerranéenne',saison:["Automne","Hiver"],difficulte:'Difficile',ingredients:[ing("Semoule",500,"g",EP),ing("Cuisses de poulet",4,"pièces",BO),ing("Merguez",6,"pièces",BO),ing("Légumes couscous",800,"g",SU),ing("Pois chiches",400,"g",EP),ing("Épices couscous",1,"sachet",EP)],etapes:["Faire dorer les cuisses de poulet dans une cocotte, ajouter les épices.","Ajouter les légumes et les pois chiches égouttés, couvrir d'eau, mijoter 40 min.","Griller les merguez à la poêle 10 min.","Préparer la semoule selon les instructions du paquet.","Servir la semoule avec le bouillon, les légumes, le poulet et les merguez."]},
{nom:"Crêpes",cat:'Dessert',portions:4,temps:30,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Farine",250,"g",EP),ing("Œufs",3,"pièces",CR),ing("Lait",50,"cl",CR),ing("Beurre",30,"g",CR),ing("Sucre",50,"g",EP)],etapes:["Mélanger la farine et le sucre, creuser un puits et ajouter les œufs.","Délayer progressivement avec le lait en fouettant pour éviter les grumeaux.","Ajouter le beurre fondu, laisser reposer 30 min.","Cuire les crêpes dans une poêle chaude et légèrement beurrée, 1 à 2 min de chaque côté."]},
{nom:"Poulet basquaise",cat:'Plat',portions:4,temps:50,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Cuisses de poulet",4,"pièces",BO),ing("Poivrons",3,"pièces",FL),ing("Tomates",4,"pièces",FL),ing("Oignon",2,"pièces",FL),ing("Ail",2,"gousses",FL),ing("Piment d'Espelette",1,"pincée",EP)],etapes:["Faire dorer les cuisses de poulet dans une cocotte, réserver.","Faire revenir oignons, poivrons émincés et ail 5 min.","Ajouter les tomates concassées, le piment d'Espelette, remettre le poulet.","Laisser mijoter à couvert 35 min à feu doux."]},
{nom:"Moules marinières",cat:'Plat',portions:4,temps:25,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Moules",2,"kg",PO),ing("Échalotes",3,"pièces",FL),ing("Vin blanc",20,"cl",EP),ing("Crème fraîche",10,"cl",CR),ing("Persil",1,"botte",FL)],etapes:["Laver et trier les moules, jeter celles qui restent ouvertes.","Faire revenir les échalotes émincées dans un peu de beurre.","Ajouter le vin blanc, porter à ébullition, verser les moules.","Couvrir et cuire 5 à 7 min en remuant, jusqu'à ce qu'elles soient ouvertes.","Ajouter la crème et le persil ciselé avant de servir."]},
{nom:"Tarte aux poireaux",cat:'Plat',portions:4,temps:50,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Pâte brisée",1,"pièce",CR),ing("Poireaux",4,"pièces",FL),ing("Œufs",3,"pièces",CR),ing("Crème fraîche",20,"cl",CR),ing("Gruyère râpé",80,"g",CR)],etapes:["Préchauffer le four à 180°C, foncer un moule avec la pâte.","Émincer les poireaux et les faire fondre 15 min à la poêle avec un peu de beurre.","Battre les œufs avec la crème, saler, poivrer, mélanger aux poireaux.","Verser sur la pâte, parsemer de gruyère et enfourner 30 min."]},
{nom:"Poêlée de crevettes à l'ail",cat:'Plat',portions:4,temps:20,cuisine:'Méditerranéenne',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Crevettes décortiquées",500,"g",PO),ing("Ail",4,"gousses",FL),ing("Persil",1,"botte",FL),ing("Riz",300,"g",EP),ing("Citron",1,"pièce",FL)],etapes:["Cuire le riz selon les instructions du paquet.","Faire chauffer un filet d'huile d'olive, ajouter l'ail émincé.","Ajouter les crevettes, saisir 3 à 4 min à feu vif jusqu'à ce qu'elles soient roses.","Ajouter le persil ciselé et un filet de citron, servir avec le riz."]},
{nom:"Escalopes de dinde à la crème",cat:'Plat',portions:4,temps:25,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Escalopes de dinde",4,"pièces",BO),ing("Champignons de Paris",250,"g",FL),ing("Crème fraîche",20,"cl",CR),ing("Échalote",1,"pièce",FL),ing("Pâtes",350,"g",EP)],etapes:["Cuire les pâtes selon les instructions du paquet.","Faire dorer les escalopes 3 min de chaque côté, réserver.","Faire revenir l'échalote et les champignons émincés dans la même poêle.","Ajouter la crème, laisser réduire 3 min, remettre les escalopes pour les réchauffer.","Servir avec les pâtes."]},
{nom:"Chou-fleur gratiné",cat:'Plat',portions:4,temps:45,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Chou-fleur",1,"pièce",FL),ing("Béchamel",40,"cl",EP),ing("Gruyère râpé",120,"g",CR),ing("Jambon blanc",4,"tranches",BO)],etapes:["Cuire le chou-fleur en fleurettes 15 min à la vapeur.","Préchauffer le four à 200°C.","Disposer le chou-fleur et le jambon coupé en morceaux dans un plat, napper de béchamel.","Parsemer de gruyère et enfourner 20 min jusqu'à coloration."]},
{nom:"Filet mignon de porc au miel",cat:'Plat',portions:4,temps:40,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filet mignon de porc",1,"pièce",BO),ing("Miel",3,"c.à.s",EP),ing("Moutarde",2,"c.à.s",EP),ing("Pommes de terre",800,"g",FL),ing("Thym",1,"branche",FL)],etapes:["Préchauffer le four à 200°C. Mélanger miel et moutarde, en badigeonner le filet mignon.","Couper les pommes de terre en morceaux, les disposer dans un plat avec le filet mignon et le thym.","Enfourner 35 min en arrosant à mi-cuisson.","Laisser reposer 5 min avant de trancher."]},
{nom:"Riz cantonais",cat:'Plat',portions:4,temps:25,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Riz",300,"g",EP),ing("Œufs",2,"pièces",CR),ing("Petits pois",150,"g",SU),ing("Jambon blanc",2,"tranches",BO),ing("Sauce soja",3,"c.à.s",EP)],etapes:["Cuire le riz la veille de préférence, ou le laisser refroidir.","Battre les œufs et les cuire en omelette fine, couper en lanières.","Faire sauter le riz à feu vif avec les petits pois et le jambon en dés.","Ajouter l'omelette et la sauce soja, bien mélanger."]},
{nom:"Endives au jambon",cat:'Plat',portions:4,temps:50,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Endives",8,"pièces",FL),ing("Jambon blanc",8,"tranches",BO),ing("Béchamel",40,"cl",EP),ing("Gruyère râpé",100,"g",CR)],etapes:["Cuire les endives 20 min à la vapeur ou à l'eau salée.","Préchauffer le four à 200°C. Enrouler chaque endive dans une tranche de jambon.","Disposer dans un plat, napper de béchamel et parsemer de gruyère.","Enfourner 20 min jusqu'à gratinage."]},
{nom:"Poisson pané & frites",cat:'Plat',portions:4,temps:25,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poisson panés",8,"pièces",SU),ing("Frites surgelées",600,"g",SU),ing("Citron",1,"pièce",FL)],etapes:["Cuire les frites au four ou à la friteuse selon les instructions du paquet.","Cuire les filets de poisson panés à la poêle ou au four selon les instructions.","Servir avec un quartier de citron."]},
{nom:"Tajine de poulet aux abricots",cat:'Plat',portions:4,temps:60,cuisine:'Méditerranéenne',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Cuisses de poulet",4,"pièces",BO),ing("Abricots secs",150,"g",EP),ing("Oignon",2,"pièces",FL),ing("Cannelle",1,"pincée",EP),ing("Amandes effilées",50,"g",EP),ing("Semoule",300,"g",EP)],etapes:["Faire dorer les cuisses de poulet dans une cocotte, réserver.","Faire revenir les oignons émincés avec la cannelle.","Remettre le poulet, ajouter les abricots secs et de l'eau à mi-hauteur.","Laisser mijoter à couvert 40 min.","Parsemer d'amandes effilées grillées et servir avec la semoule."]},
{nom:"Salade de chèvre chaud",cat:'Entrée',portions:2,temps:20,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Facile',ingredients:[ing("Fromage de chèvre",1,"bûche",CR),ing("Pain de mie",4,"tranches",BL),ing("Salade verte",1,"pièce",FL),ing("Miel",2,"c.à.s",EP),ing("Noix",40,"g",EP)],etapes:["Préchauffer le four en position grill.","Couper le chèvre en rondelles et les poser sur les tranches de pain.","Passer au grill 5 min jusqu'à ce que le fromage soit doré.","Dresser sur la salade assaisonnée, arroser de miel et parsemer de noix."]},
{nom:"Boulettes de bœuf sauce tomate",cat:'Plat',portions:4,temps:40,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Bœuf haché",500,"g",BO),ing("Chapelure",50,"g",EP),ing("Œuf",1,"pièce",CR),ing("Tomates concassées",800,"g",EP),ing("Ail",2,"gousses",FL),ing("Pâtes",350,"g",EP)],etapes:["Mélanger le bœuf haché, la chapelure, l'œuf, sel et poivre, former des boulettes.","Faire dorer les boulettes à la poêle sur toutes les faces.","Ajouter les tomates concassées et l'ail écrasé, laisser mijoter 20 min.","Cuire les pâtes et servir avec les boulettes et leur sauce."]},
{nom:"Velouté de courgettes",cat:'Entrée',portions:4,temps:30,cuisine:'Française',saison:["Été"],difficulte:'Moyen',ingredients:[ing("Courgettes",1,"kg",FL),ing("Pommes de terre",300,"g",FL),ing("Oignon",1,"pièce",FL),ing("Crème fraîche",10,"cl",CR),ing("Bouillon de légumes",1,"cube",EP)],etapes:["Faire revenir l'oignon émincé, ajouter les courgettes et pommes de terre coupées.","Couvrir d'eau, ajouter le bouillon cube, cuire 20 min.","Mixer jusqu'à obtenir une texture lisse.","Ajouter la crème fraîche hors du feu avant de servir."]},
{nom:"Rôti de porc aux pruneaux",cat:'Plat',portions:6,temps:90,cuisine:'Française',saison:["Toute saison"],difficulte:'Difficile',ingredients:[ing("Rôti de porc",1,"kg",BO),ing("Pruneaux",200,"g",EP),ing("Oignon",1,"pièce",FL),ing("Vin blanc",15,"cl",EP),ing("Crème fraîche",15,"cl",CR)],etapes:["Faire dorer le rôti sur toutes les faces dans une cocotte.","Ajouter l'oignon émincé, le vin blanc et les pruneaux.","Laisser mijoter à couvert 1h en retournant le rôti régulièrement.","Trancher le rôti, ajouter la crème fraîche à la sauce et napper."]},
{nom:"Œufs cocotte au jambon",cat:'Entrée',portions:2,temps:15,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Œufs",4,"pièces",CR),ing("Jambon blanc",2,"tranches",BO),ing("Crème fraîche",6,"c.à.s",CR),ing("Gruyère râpé",30,"g",CR)],etapes:["Préchauffer le four à 180°C.","Répartir le jambon coupé en dés dans des ramequins, ajouter une cuillère de crème.","Casser un œuf dans chaque ramequin, saler, poivrer, parsemer de gruyère.","Cuire au bain-marie 12 à 15 min au four."]},
{nom:"Pâtes au pesto & tomates séchées",cat:'Plat',portions:4,temps:15,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Penne",350,"g",EP),ing("Pesto",1,"pot",EP),ing("Tomates séchées",80,"g",EP),ing("Parmesan",50,"g",CR),ing("Pignons de pin",30,"g",EP)],etapes:["Cuire les pâtes al dente, égoutter en gardant un peu d'eau de cuisson.","Mélanger les pâtes chaudes au pesto, en détendant avec l'eau de cuisson si besoin.","Ajouter les tomates séchées coupées en lanières et les pignons.","Servir avec du parmesan râpé."]},
{nom:"Curry de légumes",cat:'Plat',portions:4,temps:35,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Pommes de terre",400,"g",FL),ing("Chou-fleur",1,"pièce",FL),ing("Lait de coco",40,"cl",EP),ing("Curry en poudre",2,"c.à.s",EP),ing("Oignon",1,"pièce",FL),ing("Riz",300,"g",EP)],etapes:["Faire revenir l'oignon émincé, ajouter le curry et mélanger 1 min.","Ajouter les pommes de terre en dés et le chou-fleur en fleurettes.","Verser le lait de coco, laisser mijoter 20 min jusqu'à ce que les légumes soient tendres.","Servir avec du riz basmati."]},
{nom:"Brochettes de poulet marinées",cat:'Plat',portions:4,temps:30,cuisine:'Méditerranéenne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",600,"g",BO),ing("Poivrons",2,"pièces",FL),ing("Sauce soja",4,"c.à.s",EP),ing("Miel",2,"c.à.s",EP),ing("Ail",2,"gousses",FL)],etapes:["Couper le poulet en cubes, mélanger avec sauce soja, miel et ail écrasé, laisser mariner 30 min.","Couper les poivrons en morceaux, enfiler poulet et poivrons sur des piques.","Griller les brochettes 12 à 15 min en les retournant régulièrement."]},
{nom:"Paëlla express",cat:'Plat',portions:6,temps:45,cuisine:'Méditerranéenne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Riz",400,"g",EP),ing("Crevettes décortiquées",300,"g",PO),ing("Cuisses de poulet",2,"pièces",BO),ing("Poivrons",2,"pièces",FL),ing("Chorizo",150,"g",BO),ing("Safran",1,"dose",EP)],etapes:["Faire dorer le poulet et le chorizo en morceaux dans une grande poêle.","Ajouter les poivrons émincés, cuire 5 min.","Ajouter le riz, mélanger, puis verser de l'eau chaude safranée à hauteur.","Laisser cuire 20 min sans remuer, ajouter les crevettes 5 min avant la fin."]},
{nom:"Tomates farcies",cat:'Plat',portions:4,temps:55,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Tomates",8,"pièces",FL),ing("Bœuf haché",400,"g",BO),ing("Oignon",1,"pièce",FL),ing("Chapelure",30,"g",EP),ing("Persil",1,"botte",FL),ing("Riz",150,"g",EP)],etapes:["Couper le chapeau des tomates, évider la chair, réserver.","Mélanger le bœuf haché, l'oignon émincé, la chapelure, le persil ciselé et un peu de chair de tomate.","Farcir les tomates avec la préparation, refermer avec le chapeau.","Enfourner à 180°C pendant 40 min. Servir avec du riz."]},
{nom:"Poêlée de saint-jacques",cat:'Plat',portions:4,temps:20,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Noix de Saint-Jacques",500,"g",PO),ing("Beurre",30,"g",CR),ing("Ail",2,"gousses",FL),ing("Persil",1,"botte",FL),ing("Riz",300,"g",EP)],etapes:["Cuire le riz selon les instructions du paquet.","Faire chauffer le beurre dans une poêle bien chaude.","Saisir les noix de Saint-Jacques 1 à 2 min de chaque côté.","Ajouter l'ail et le persil ciselé en fin de cuisson, servir avec le riz."]},
{nom:"Gratin de courgettes",cat:'Plat',portions:4,temps:45,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Courgettes",1,"kg",FL),ing("Œufs",3,"pièces",CR),ing("Crème fraîche",15,"cl",CR),ing("Gruyère râpé",100,"g",CR),ing("Ail",1,"gousse",FL)],etapes:["Préchauffer le four à 180°C. Couper les courgettes en rondelles et les faire revenir 10 min à la poêle.","Battre les œufs avec la crème et l'ail écrasé.","Disposer les courgettes dans un plat, verser l'appareil, parsemer de gruyère.","Enfourner 25 min jusqu'à ce que le dessus soit doré."]},
{nom:"Pain perdu",cat:'Dessert',portions:4,temps:20,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Pain de mie",6,"tranches",BL),ing("Œufs",2,"pièces",CR),ing("Lait",25,"cl",CR),ing("Sucre",40,"g",EP),ing("Beurre",20,"g",CR)],etapes:["Battre les œufs avec le lait et le sucre.","Tremper les tranches de pain dans le mélange quelques secondes de chaque côté.","Faire dorer à la poêle dans le beurre, 2 à 3 min de chaque côté."]},
{nom:"Mousse au chocolat",cat:'Dessert',portions:4,temps:20,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Chocolat noir",200,"g",EP),ing("Œufs",4,"pièces",CR),ing("Sucre",30,"g",EP)],etapes:["Faire fondre le chocolat au bain-marie.","Séparer les blancs des jaunes. Incorporer les jaunes au chocolat fondu.","Monter les blancs en neige avec le sucre, les incorporer délicatement au mélange.","Répartir dans des ramequins, réfrigérer au moins 3h."]},
{nom:"Tarte aux pommes",cat:'Dessert',portions:6,temps:50,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Pâte feuilletée",1,"pièce",CR),ing("Pommes",5,"pièces",FL),ing("Sucre",60,"g",EP),ing("Beurre",20,"g",CR)],etapes:["Préchauffer le four à 200°C, foncer un moule avec la pâte feuilletée.","Éplucher et couper les pommes en fines lamelles, les disposer en rosace sur la pâte.","Saupoudrer de sucre, parsemer de quelques noisettes de beurre.","Enfourner 30 à 35 min jusqu'à ce que la pâte soit dorée."]},
{nom:"Riz au lait",cat:'Dessert',portions:4,temps:45,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Riz rond",150,"g",EP),ing("Lait",1,"L",CR),ing("Sucre",60,"g",EP),ing("Vanille",1,"gousse",EP)],etapes:["Porter le lait à ébullition avec la vanille fendue.","Ajouter le riz, baisser le feu et laisser cuire 35 à 40 min en remuant régulièrement.","Ajouter le sucre en fin de cuisson, mélanger.","Servir tiède ou froid."]},
{nom:"Yaourt maison aux fruits",cat:'Dessert',portions:4,temps:15,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Yaourts nature",4,"pièces",CR),ing("Fruits rouges",200,"g",SU),ing("Miel",3,"c.à.s",EP)],etapes:["Répartir les yaourts dans des coupelles.","Ajouter les fruits rouges décongelés.","Napper de miel avant de servir."]},
{nom:"Cookies maison",cat:'Dessert',portions:6,temps:30,cuisine:'Autre',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Farine",250,"g",EP),ing("Beurre",125,"g",CR),ing("Sucre roux",150,"g",EP),ing("Œuf",1,"pièce",CR),ing("Pépites de chocolat",150,"g",EP)],etapes:["Préchauffer le four à 180°C. Mélanger le beurre mou et le sucre jusqu'à obtenir une texture crémeuse.","Ajouter l'œuf, puis la farine et les pépites de chocolat.","Former des boules, les aplatir légèrement sur une plaque.","Enfourner 10 à 12 min, laisser refroidir avant de déguster."]},
{nom:"Salade de fruits frais",cat:'Dessert',portions:4,temps:15,cuisine:'Autre',saison:["Été"],difficulte:'Facile',ingredients:[ing("Pomme",2,"pièces",FL),ing("Orange",2,"pièces",FL),ing("Banane",2,"pièces",FL),ing("Kiwi",2,"pièces",FL),ing("Citron",1,"pièce",FL)],etapes:["Éplucher et couper tous les fruits en morceaux.","Mélanger dans un saladier, arroser de jus de citron pour éviter l'oxydation.","Réserver au frais 30 min avant de servir."]},
{nom:"Croissants au four (dépannage)",cat:'Petit-déj',portions:4,temps:15,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Croissants surgelés",4,"pièces",SU),ing("Confiture",1,"pot",EP)],etapes:["Préchauffer le four à 180°C.","Enfourner les croissants 12 à 15 min jusqu'à coloration.","Servir avec de la confiture."]},
{nom:"Porridge aux fruits",cat:'Petit-déj',portions:2,temps:10,cuisine:'Autre',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Flocons d'avoine",80,"g",EP),ing("Lait",30,"cl",CR),ing("Banane",1,"pièce",FL),ing("Miel",2,"c.à.s",EP)],etapes:["Faire chauffer le lait, ajouter les flocons d'avoine.","Cuire 5 min à feu doux en remuant jusqu'à obtenir une texture crémeuse.","Ajouter la banane coupée en rondelles et le miel avant de servir."]},
{nom:"Pancakes",cat:'Petit-déj',portions:4,temps:20,cuisine:'Autre',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Farine",200,"g",EP),ing("Œufs",2,"pièces",CR),ing("Lait",25,"cl",CR),ing("Sucre",20,"g",EP),ing("Levure chimique",1,"sachet",EP)],etapes:["Mélanger la farine, le sucre et la levure.","Ajouter les œufs et le lait progressivement en fouettant pour éviter les grumeaux.","Cuire des petites louches de pâte dans une poêle chaude légèrement beurrée, 2 min de chaque côté."]},
{nom:"Œufs brouillés & toasts",cat:'Petit-déj',portions:2,temps:10,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Œufs",4,"pièces",CR),ing("Pain de mie",4,"tranches",BL),ing("Beurre",20,"g",CR)],etapes:["Battre les œufs, saler, poivrer.","Cuire à feu doux dans une noisette de beurre en remuant sans arrêt jusqu'à texture crémeuse.","Servir avec des toasts grillés et beurrés."]},
{nom:"Salade grecque",cat:'Entrée',portions:4,temps:15,cuisine:'Méditerranéenne',saison:["Été"],difficulte:'Facile',ingredients:[ing("Tomates",4,"pièces",FL),ing("Concombre",1,"pièce",FL),ing("Feta",200,"g",CR),ing("Olives noires",100,"g",EP),ing("Oignon rouge",1,"pièce",FL)],etapes:["Couper les tomates, le concombre et l'oignon rouge en morceaux.","Ajouter les olives et la feta coupée en dés.","Assaisonner d'huile d'olive, d'origan, de sel et de poivre."]},
{nom:"Velouté de potiron",cat:'Entrée',portions:4,temps:35,cuisine:'Française',saison:["Automne"],difficulte:'Moyen',ingredients:[ing("Potiron",1,"kg",FL),ing("Pommes de terre",300,"g",FL),ing("Oignon",1,"pièce",FL),ing("Crème fraîche",10,"cl",CR),ing("Bouillon de légumes",1,"cube",EP)],etapes:["Faire revenir l'oignon émincé, ajouter le potiron et les pommes de terre en morceaux.","Couvrir d'eau, ajouter le bouillon cube, cuire 25 min.","Mixer jusqu'à obtenir une texture lisse et onctueuse.","Ajouter la crème hors du feu avant de servir."]},
{nom:"Poulet à la moutarde",cat:'Plat',portions:4,temps:40,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Cuisses de poulet",4,"pièces",BO),ing("Moutarde",3,"c.à.s",EP),ing("Crème fraîche",20,"cl",CR),ing("Échalote",1,"pièce",FL),ing("Riz",300,"g",EP)],etapes:["Badigeonner les cuisses de poulet de moutarde, les faire dorer à la poêle.","Ajouter l'échalote émincée, couvrir et laisser cuire 25 min à feu doux.","Ajouter la crème fraîche en fin de cuisson, mélanger avec le jus.","Servir avec du riz."]},
{nom:"Wrap au poulet croustillant",cat:'Plat',portions:4,temps:25,cuisine:'Autre',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Tortillas",4,"pièces",EP),ing("Filets de poulet pané",4,"pièces",SU),ing("Salade verte",1,"pièce",FL),ing("Tomates",2,"pièces",FL),ing("Sauce fromagère",1,"pot",EP)],etapes:["Cuire les filets de poulet panés selon les instructions du paquet, couper en lanières.","Réchauffer légèrement les tortillas.","Garnir de salade, tomates coupées, poulet et sauce fromagère.","Rouler fermement les wraps."]},
{nom:"Chakchouka",cat:'Plat',portions:4,temps:35,cuisine:'Méditerranéenne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Poivrons",3,"pièces",FL),ing("Tomates",5,"pièces",FL),ing("Œufs",4,"pièces",CR),ing("Oignon",1,"pièce",FL),ing("Cumin",1,"pincée",EP)],etapes:["Faire revenir l'oignon et les poivrons émincés 10 min.","Ajouter les tomates concassées et le cumin, laisser mijoter 15 min.","Creuser des puits dans la sauce, y casser les œufs.","Couvrir et cuire 6 à 8 min jusqu'à ce que les blancs soient pris."]},
{nom:"Poulet rôti aux herbes",cat:'Plat',portions:4,temps:75,cuisine:'Française',saison:["Toute saison"],difficulte:'Difficile',ingredients:[ing("Poulet fermier",1,"pièce",BO),ing("Romarin",1,"branche",FL),ing("Citron",1,"pièce",FL),ing("Ail",4,"gousses",FL),ing("Pommes de terre",800,"g",FL)],etapes:["Préchauffer le four à 200°C. Glisser le romarin, l'ail et le citron coupé en deux dans le poulet.","Disposer les pommes de terre coupées autour dans un plat.","Enfourner 1h15 en arrosant régulièrement.","Laisser reposer 10 min avant de découper."]},
{nom:"Nouilles sautées au tofu",cat:'Plat',portions:4,temps:25,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Nouilles chinoises",300,"g",EP),ing("Tofu",300,"g",EP),ing("Légumes pour wok",500,"g",SU),ing("Sauce soja",4,"c.à.s",EP),ing("Gingembre",1,"morceau",FL)],etapes:["Cuire les nouilles selon les instructions, égoutter.","Couper le tofu en cubes et le faire dorer à la poêle.","Ajouter les légumes et le gingembre râpé, faire sauter 5 min.","Ajouter les nouilles et la sauce soja, bien mélanger 2 min."]},
{nom:"Poulet à l'ananas",cat:'Plat',portions:4,temps:35,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",500,"g",BO),ing("Ananas en morceaux",400,"g",EP),ing("Sauce soja",3,"c.à.s",EP),ing("Poivrons",1,"pièce",FL),ing("Riz",300,"g",EP)],etapes:["Couper le poulet en morceaux et le faire dorer à la poêle.","Ajouter le poivron émincé, cuire 5 min.","Ajouter l'ananas égoutté et la sauce soja, laisser mijoter 10 min.","Servir avec du riz."]},
{nom:"Soupe miso au tofu",cat:'Entrée',portions:4,temps:20,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Pâte miso",3,"c.à.s",EP),ing("Tofu",200,"g",EP),ing("Algues wakamé",10,"g",EP),ing("Oignon nouveau",2,"pièces",FL)],etapes:["Faire chauffer 1L d'eau sans bouillir.","Diluer la pâte miso dans un peu d'eau chaude puis l'ajouter au bouillon.","Ajouter le tofu en dés et les algues réhydratées.","Parsemer d'oignon nouveau ciselé avant de servir."]},
{nom:"Escalope milanaise",cat:'Plat',portions:4,temps:25,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Escalopes de poulet",4,"pièces",BO),ing("Chapelure",100,"g",EP),ing("Œuf",1,"pièce",CR),ing("Parmesan",30,"g",CR),ing("Spaghetti",300,"g",EP)],etapes:["Battre l'œuf dans une assiette, mélanger la chapelure et le parmesan dans une autre.","Tremper les escalopes dans l'œuf puis dans la chapelure.","Cuire à la poêle 4 min de chaque côté jusqu'à coloration dorée.","Servir avec des spaghetti nature."]},
{nom:"Rougail saucisses",cat:'Plat',portions:4,temps:40,cuisine:'Autre',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Saucisses fumées",6,"pièces",BO),ing("Tomates",4,"pièces",FL),ing("Oignon",2,"pièces",FL),ing("Ail",2,"gousses",FL),ing("Piment",1,"pièce",FL),ing("Riz",300,"g",EP)],etapes:["Faire dorer les saucisses coupées en tronçons, réserver.","Faire revenir oignon et ail émincés, ajouter les tomates concassées et le piment.","Remettre les saucisses, laisser mijoter 25 min.","Servir avec du riz blanc."]},
{nom:"Poulet grillé & légumes rôtis",cat:'Plat',portions:4,temps:45,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",600,"g",BO),ing("Courgettes",2,"pièces",FL),ing("Poivrons",2,"pièces",FL),ing("Huile d'olive",3,"c.à.s",EP),ing("Herbes de Provence",1,"pincée",EP)],etapes:["Préchauffer le four à 200°C. Couper les légumes en morceaux, les mélanger à l'huile et aux herbes.","Enfourner les légumes 20 min.","Griller le poulet à la poêle 6 à 8 min de chaque côté.","Servir le poulet avec les légumes rôtis."]},
{nom:"Gnocchis à la sauce tomate",cat:'Plat',portions:4,temps:20,cuisine:'Italienne',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Gnocchis",500,"g",EP),ing("Sauce tomate",400,"g",EP),ing("Parmesan",50,"g",CR),ing("Basilic",1,"botte",FL)],etapes:["Cuire les gnocchis dans l'eau bouillante salée jusqu'à ce qu'ils remontent à la surface.","Réchauffer la sauce tomate dans une poêle.","Mélanger les gnocchis égouttés à la sauce.","Servir avec du parmesan et du basilic frais."]},
{nom:"Poulet teriyaki",cat:'Plat',portions:4,temps:30,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",500,"g",BO),ing("Sauce soja",4,"c.à.s",EP),ing("Miel",2,"c.à.s",EP),ing("Gingembre",1,"morceau",FL),ing("Riz",300,"g",EP)],etapes:["Couper le poulet en morceaux, faire dorer à la poêle.","Mélanger sauce soja, miel et gingembre râpé, verser sur le poulet.","Laisser réduire 10 min à feu moyen jusqu'à ce que la sauce nappe le poulet.","Servir avec du riz."]},
{nom:"Soupe à l'oignon gratinée",cat:'Entrée',portions:4,temps:50,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Oignons",6,"pièces",FL),ing("Bouillon de bœuf",1,"L",EP),ing("Pain",4,"tranches",BL),ing("Gruyère râpé",100,"g",CR),ing("Beurre",30,"g",CR)],etapes:["Faire fondre les oignons émincés dans le beurre 25 min à feu doux jusqu'à caramélisation.","Ajouter le bouillon, laisser mijoter 15 min.","Répartir dans des bols, poser une tranche de pain et du gruyère sur chaque bol.","Passer sous le grill 5 min jusqu'à ce que le fromage soit doré."]},
{nom:"Poêlée de gambas au curry",cat:'Plat',portions:4,temps:20,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Gambas",500,"g",PO),ing("Lait de coco",20,"cl",EP),ing("Curry en poudre",1,"c.à.s",EP),ing("Riz",300,"g",EP),ing("Coriandre",1,"botte",FL)],etapes:["Cuire le riz selon les instructions du paquet.","Faire chauffer un peu d'huile, saisir les gambas 3 min.","Ajouter le curry et le lait de coco, laisser mijoter 5 min.","Parsemer de coriandre fraîche, servir avec le riz."]},
{nom:"Flan pâtissier",cat:'Dessert',portions:6,temps:60,cuisine:'Française',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Pâte brisée",1,"pièce",CR),ing("Lait",1,"L",CR),ing("Œufs",4,"pièces",CR),ing("Sucre",150,"g",EP),ing("Farine",80,"g",EP),ing("Vanille",1,"gousse",EP)],etapes:["Préchauffer le four à 180°C, foncer un moule avec la pâte brisée.","Faire chauffer le lait avec la vanille fendue.","Fouetter œufs, sucre et farine, verser le lait chaud dessus en fouettant.","Verser sur la pâte, enfourner 45 min jusqu'à ce que le flan soit pris et doré."]},
{nom:"Bo bun au bœuf",cat:'Plat',portions:4,temps:35,cuisine:'Asiatique',saison:["Été"],difficulte:'Moyen',ingredients:[ing("Vermicelles de riz",300,"g",EP),ing("Bœuf (bavette)",400,"g",BO),ing("Carotte",2,"pièces",FL),ing("Concombre",1,"pièce",FL),ing("Menthe",1,"botte",FL),ing("Cacahuètes",50,"g",EP),ing("Nuoc-mâm",4,"c.à.s",EP)],etapes:["Faire tremper les vermicelles dans l'eau chaude 10 min, égoutter.","Émincer la bavette finement et la saisir à feu vif 2 min de chaque côté.","Râper la carotte, couper le concombre en bâtonnets.","Dresser les vermicelles, les légumes crus, le bœuf, la menthe et les cacahuètes concassées.","Arroser de nuoc-mâm allongé d'un peu d'eau et de citron vert."]},
{nom:"Poulet General Tao",cat:'Plat',portions:4,temps:40,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",500,"g",BO),ing("Fécule de maïs",60,"g",EP),ing("Sauce soja",4,"c.à.s",EP),ing("Miel",3,"c.à.s",EP),ing("Ail",2,"gousses",FL),ing("Riz",300,"g",EP)],etapes:["Couper le poulet en cubes, les enrober de fécule de maïs.","Faire frire les morceaux à la poêle jusqu'à ce qu'ils soient dorés et croustillants.","Mélanger sauce soja, miel et ail écrasé, verser sur le poulet en fin de cuisson.","Laisser caraméliser 2 min, servir avec du riz."]},
{nom:"Ramen au poulet",cat:'Plat',portions:4,temps:35,cuisine:'Asiatique',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Nouilles ramen",4,"portions",EP),ing("Filets de poulet",400,"g",BO),ing("Bouillon de volaille",1.2,"L",EP),ing("Œufs",4,"pièces",CR),ing("Oignon nouveau",3,"pièces",FL),ing("Champignons de Paris",150,"g",FL)],etapes:["Faire pocher les œufs 6 min dans l'eau bouillante pour un jaune coulant, réserver dans l'eau froide.","Cuire le poulet dans le bouillon 15 min, puis l'émincer.","Cuire les nouilles selon les instructions.","Répartir bouillon chaud, nouilles, poulet, champignons émincés et demi-œuf dans des bols.","Parsemer d'oignon nouveau ciselé."]},
{nom:"Poke bowl saumon",cat:'Plat',portions:2,temps:20,cuisine:'Asiatique',saison:["Printemps","Été"],difficulte:'Facile',ingredients:[ing("Saumon frais",250,"g",PO),ing("Riz",150,"g",EP),ing("Avocat",1,"pièce",FL),ing("Edamame",100,"g",SU),ing("Sauce soja",3,"c.à.s",EP),ing("Graines de sésame",1,"c.à.s",EP)],etapes:["Cuire le riz et laisser refroidir légèrement.","Couper le saumon frais en cubes, mariner 5 min dans la sauce soja.","Couper l'avocat en lamelles, cuire les edamame selon le paquet.","Dresser le riz avec le saumon, l'avocat et les edamame, parsemer de sésame."]},
{nom:"Sauté de bœuf aux légumes croquants",cat:'Plat',portions:4,temps:25,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Bœuf (émincé)",450,"g",BO),ing("Poivrons",2,"pièces",FL),ing("Brocoli",1,"pièce",FL),ing("Sauce soja",4,"c.à.s",EP),ing("Gingembre",1,"morceau",FL),ing("Riz",300,"g",EP)],etapes:["Faire mariner le bœuf émincé dans un peu de sauce soja 10 min.","Saisir le bœuf à feu vif 2 min, réserver.","Faire sauter poivrons et brocoli 5 min, garder du croquant.","Remettre le bœuf, ajouter gingembre râpé et sauce soja, mélanger 2 min.","Servir avec du riz."]},
{nom:"Nems au poulet",cat:'Entrée',portions:4,temps:45,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Galettes de riz",16,"pièces",EP),ing("Poulet haché",300,"g",BO),ing("Carotte",1,"pièce",FL),ing("Vermicelles de riz",50,"g",EP),ing("Champignons noirs",20,"g",EP)],etapes:["Réhydrater les vermicelles et champignons noirs, les couper finement.","Mélanger avec le poulet haché et la carotte râpée, saler, poivrer.","Tremper les galettes de riz brièvement, garnir et rouler fermement.","Faire frire dans l'huile chaude 6 à 8 min jusqu'à coloration dorée."]},
{nom:"Dhal de lentilles corail",cat:'Plat',portions:4,temps:30,cuisine:'Asiatique',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Lentilles corail",300,"g",EP),ing("Lait de coco",20,"cl",EP),ing("Curry en poudre",2,"c.à.s",EP),ing("Oignon",1,"pièce",FL),ing("Ail",2,"gousses",FL),ing("Riz",300,"g",EP)],etapes:["Faire revenir l'oignon et l'ail émincés avec le curry 2 min.","Ajouter les lentilles rincées et couvrir d'eau à hauteur.","Laisser mijoter 20 min en remuant régulièrement jusqu'à ce que les lentilles fondent.","Ajouter le lait de coco en fin de cuisson, servir avec du riz."]},
{nom:"Riz sauté aux crevettes",cat:'Plat',portions:4,temps:20,cuisine:'Asiatique',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Riz",300,"g",EP),ing("Crevettes décortiquées",300,"g",PO),ing("Œufs",2,"pièces",CR),ing("Petits pois",100,"g",SU),ing("Sauce soja",3,"c.à.s",EP)],etapes:["Cuire le riz à l'avance et le laisser refroidir.","Faire sauter les crevettes 2 min à feu vif, réserver.","Cuire les œufs battus en morceaux dans la même poêle.","Ajouter le riz, les petits pois, les crevettes et la sauce soja, bien mélanger."]},
{nom:"Tacos au bœuf épicé",cat:'Plat',portions:4,temps:25,cuisine:'Mexicaine',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Tortillas de maïs",8,"pièces",EP),ing("Bœuf haché",400,"g",BO),ing("Épices tacos",1,"sachet",EP),ing("Tomates",2,"pièces",FL),ing("Salade",1,"pièce",FL),ing("Fromage râpé",80,"g",CR)],etapes:["Faire revenir le bœuf haché avec les épices tacos 8 min.","Réchauffer les tortillas quelques secondes de chaque côté.","Garnir de viande, tomates coupées, salade et fromage râpé."]},
{nom:"Quesadillas au poulet",cat:'Plat',portions:4,temps:20,cuisine:'Mexicaine',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Tortillas",4,"pièces",EP),ing("Filets de poulet",300,"g",BO),ing("Fromage râpé",150,"g",CR),ing("Poivrons",1,"pièce",FL),ing("Oignon",1,"pièce",FL)],etapes:["Faire revenir le poulet coupé en dés avec poivrons et oignon émincés.","Répartir la garniture et le fromage sur une moitié de chaque tortilla, replier.","Cuire à la poêle 2 à 3 min de chaque côté jusqu'à ce que le fromage fonde."]},
{nom:"Burritos au bœuf et riz",cat:'Plat',portions:4,temps:35,cuisine:'Mexicaine',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Tortillas",4,"pièces",EP),ing("Bœuf haché",400,"g",BO),ing("Riz",150,"g",EP),ing("Haricots rouges",400,"g",EP),ing("Fromage râpé",100,"g",CR),ing("Épices tacos",1,"sachet",EP)],etapes:["Cuire le riz selon les instructions.","Faire revenir le bœuf haché avec les épices, ajouter les haricots rouges égouttés.","Garnir les tortillas de riz, viande et fromage, rouler fermement.","Optionnel : dorer les burritos 2 min à la poêle avant de servir."]},
{nom:"Guacamole & chips",cat:'Entrée',portions:4,temps:15,cuisine:'Mexicaine',saison:["Été"],difficulte:'Facile',ingredients:[ing("Avocats",3,"pièces",FL),ing("Citron vert",1,"pièce",FL),ing("Tomate",1,"pièce",FL),ing("Oignon rouge",1,"pièce",FL),ing("Chips de maïs",1,"paquet",EP)],etapes:["Écraser la chair des avocats à la fourchette.","Ajouter le jus de citron vert, la tomate et l'oignon rouge coupés en petits dés.","Saler, poivrer, mélanger et servir avec les chips."]},
{nom:"Chili sin carne",cat:'Plat',portions:4,temps:40,cuisine:'Mexicaine',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Haricots rouges",400,"g",EP),ing("Haricots noirs",400,"g",EP),ing("Tomates concassées",800,"g",EP),ing("Maïs",140,"g",EP),ing("Oignon",1,"pièce",FL),ing("Épices chili",1,"sachet",EP)],etapes:["Faire revenir l'oignon émincé, ajouter les épices.","Ajouter les tomates concassées, les haricots égouttés et le maïs.","Laisser mijoter 30 min à feu doux.","Servir avec du riz ou du pain."]},
{nom:"Houmous & pain pita",cat:'Entrée',portions:4,temps:15,cuisine:'Méditerranéenne',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Pois chiches",400,"g",EP),ing("Tahini",2,"c.à.s",EP),ing("Citron",1,"pièce",FL),ing("Ail",1,"gousse",FL),ing("Pain pita",4,"pièces",BL)],etapes:["Mixer les pois chiches égouttés avec le tahini, le jus de citron et l'ail.","Ajuster la texture avec un peu d'eau si nécessaire, saler.","Servir avec un filet d'huile d'olive et le pain pita chaud."]},
{nom:"Falafels maison",cat:'Plat',portions:4,temps:40,cuisine:'Méditerranéenne',saison:["Printemps","Été"],difficulte:'Moyen',ingredients:[ing("Pois chiches",400,"g",EP),ing("Oignon",1,"pièce",FL),ing("Persil",1,"botte",FL),ing("Cumin",1,"c.à.c",EP),ing("Farine",2,"c.à.s",EP),ing("Pain pita",4,"pièces",BL)],etapes:["Mixer les pois chiches égouttés avec oignon, persil, cumin et farine.","Former des boulettes aplaties.","Faire frire 3 à 4 min de chaque côté jusqu'à coloration dorée.","Servir dans un pain pita avec crudités."]},
{nom:"Poulet au citron confit",cat:'Plat',portions:4,temps:55,cuisine:'Méditerranéenne',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Cuisses de poulet",4,"pièces",BO),ing("Citron confit",1,"pièce",EP),ing("Olives vertes",100,"g",EP),ing("Oignon",1,"pièce",FL),ing("Cumin",1,"pincée",EP),ing("Semoule",300,"g",EP)],etapes:["Faire dorer les cuisses de poulet, réserver.","Faire revenir l'oignon émincé avec le cumin.","Remettre le poulet, ajouter le citron confit coupé et les olives, couvrir d'eau à mi-hauteur.","Laisser mijoter 35 min à couvert, servir avec la semoule."]},
{nom:"Salade taboulé",cat:'Entrée',portions:4,temps:25,cuisine:'Méditerranéenne',saison:["Été"],difficulte:'Moyen',ingredients:[ing("Semoule fine",150,"g",EP),ing("Tomates",3,"pièces",FL),ing("Concombre",1,"pièce",FL),ing("Persil",2,"bottes",FL),ing("Menthe",1,"botte",FL),ing("Citron",2,"pièces",FL)],etapes:["Faire gonfler la semoule dans un peu d'eau chaude 10 min, égrainer à la fourchette.","Couper finement tomates et concombre, ciseler persil et menthe.","Mélanger le tout avec la semoule, arroser de jus de citron et d'huile d'olive.","Réserver au frais avant de servir."]},
{nom:"Moussaka",cat:'Plat',portions:6,temps:80,cuisine:'Méditerranéenne',saison:["Automne"],difficulte:'Difficile',ingredients:[ing("Aubergines",3,"pièces",FL),ing("Bœuf haché",500,"g",BO),ing("Tomates concassées",400,"g",EP),ing("Béchamel",40,"cl",EP),ing("Oignon",1,"pièce",FL),ing("Parmesan",50,"g",CR)],etapes:["Couper les aubergines en tranches, les faire dorer à la poêle.","Faire revenir l'oignon et le bœuf haché, ajouter les tomates, mijoter 15 min.","Alterner couches d'aubergines et de viande dans un plat, terminer par la béchamel et le parmesan.","Enfourner 35 min à 190°C jusqu'à coloration dorée."]},
{nom:"Kebab de poulet maison",cat:'Plat',portions:4,temps:30,cuisine:'Méditerranéenne',saison:["Toute saison"],difficulte:'Moyen',ingredients:[ing("Filets de poulet",500,"g",BO),ing("Pain pita",4,"pièces",BL),ing("Salade",1,"pièce",FL),ing("Tomates",2,"pièces",FL),ing("Sauce blanche",1,"pot",EP)],etapes:["Émincer le poulet et le faire mariner avec épices au choix 15 min.","Cuire à la poêle 8 min à feu vif jusqu'à coloration.","Garnir les pains pita de salade, tomates, poulet et sauce."]},
{nom:"Poivrons farcis au riz",cat:'Plat',portions:4,temps:55,cuisine:'Méditerranéenne',saison:["Été","Automne"],difficulte:'Moyen',ingredients:[ing("Poivrons",4,"pièces",FL),ing("Riz",150,"g",EP),ing("Bœuf haché",300,"g",BO),ing("Tomates concassées",200,"g",EP),ing("Oignon",1,"pièce",FL)],etapes:["Couper le chapeau des poivrons et les évider.","Faire revenir l'oignon et le bœuf haché, ajouter le riz cru et les tomates.","Farcir les poivrons avec la préparation.","Enfourner 40 min à 180°C avec un fond d'eau dans le plat."]},
{nom:"Aligot maison",cat:'Plat',portions:4,temps:40,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Pommes de terre",1,"kg",FL),ing("Tomme fraîche",400,"g",CR),ing("Ail",2,"gousses",FL),ing("Beurre",50,"g",CR),ing("Crème fraîche",10,"cl",CR)],etapes:["Cuire les pommes de terre 25 min, les écraser en purée avec beurre et crème.","Chauffer la purée à feu doux, incorporer la tomme coupée en morceaux petit à petit.","Tirer énergiquement à la cuillère en bois jusqu'à obtenir une texture filante.","Ajouter l'ail écrasé, servir aussitôt."]},
{nom:"Pot-au-feu",cat:'Plat',portions:6,temps:180,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Difficile',ingredients:[ing("Bœuf à pot-au-feu",1.2,"kg",BO),ing("Carottes",5,"pièces",FL),ing("Poireaux",3,"pièces",FL),ing("Navets",3,"pièces",FL),ing("Oignon",1,"pièce",FL),ing("Clou de girofle",3,"pièces",EP)],etapes:["Placer la viande dans une grande cocotte, couvrir d'eau froide, porter à ébullition et écumer.","Ajouter l'oignon piqué de clous de girofle, laisser mijoter 1h30.","Ajouter les légumes coupés en gros morceaux, poursuivre la cuisson 1h.","Servir la viande et les légumes avec le bouillon et de la moutarde."]},
{nom:"Cassoulet express",cat:'Plat',portions:6,temps:60,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Haricots blancs",800,"g",EP),ing("Saucisses de Toulouse",6,"pièces",BO),ing("Lardons",150,"g",BO),ing("Tomates concassées",400,"g",EP),ing("Oignon",1,"pièce",FL),ing("Ail",2,"gousses",FL)],etapes:["Faire dorer les saucisses et les lardons dans une cocotte.","Ajouter l'oignon et l'ail émincés, cuire 5 min.","Ajouter les haricots blancs égouttés et les tomates, couvrir et laisser mijoter 35 min.","Servir bien chaud."]},
{nom:"Poulet au vin jaune & morilles",cat:'Plat',portions:4,temps:60,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Difficile',ingredients:[ing("Cuisses de poulet",4,"pièces",BO),ing("Vin jaune",15,"cl",EP),ing("Morilles séchées",30,"g",EP),ing("Crème fraîche",20,"cl",CR),ing("Échalote",2,"pièces",FL)],etapes:["Réhydrater les morilles 20 min dans l'eau tiède.","Faire dorer le poulet dans une cocotte, réserver.","Faire revenir les échalotes, déglacer au vin jaune.","Remettre le poulet et les morilles égouttées, laisser mijoter 30 min, ajouter la crème en fin de cuisson."]},
{nom:"Salade landaise",cat:'Entrée',portions:4,temps:20,cuisine:'Française',saison:["Toute saison"],difficulte:'Facile',ingredients:[ing("Salade verte",1,"pièce",FL),ing("Gésiers confits",150,"g",BO),ing("Magret fumé",100,"g",BO),ing("Tomates cerises",150,"g",FL),ing("Noix",40,"g",EP)],etapes:["Laver et disposer la salade dans les assiettes.","Réchauffer légèrement les gésiers confits à la poêle.","Ajouter le magret fumé en tranches, les tomates cerises et les noix.","Assaisonner d'une vinaigrette à l'huile de noix."]},
{nom:"Piperade basquaise",cat:'Plat',portions:4,temps:35,cuisine:'Française',saison:["Été"],difficulte:'Moyen',ingredients:[ing("Poivrons",4,"pièces",FL),ing("Tomates",4,"pièces",FL),ing("Oignon",2,"pièces",FL),ing("Œufs",4,"pièces",CR),ing("Jambon de Bayonne",4,"tranches",BO),ing("Piment d'Espelette",1,"pincée",EP)],etapes:["Faire revenir oignons et poivrons émincés 10 min.","Ajouter les tomates concassées et le piment d'Espelette, laisser mijoter 15 min.","Ajouter les œufs battus, cuire en remuant 3 min.","Servir avec le jambon de Bayonne poêlé."]},
{nom:"Confit de canard & pommes sarladaises",cat:'Plat',portions:4,temps:45,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Cuisses de canard confites",4,"pièces",BO),ing("Pommes de terre",800,"g",FL),ing("Ail",3,"gousses",FL),ing("Persil",1,"botte",FL),ing("Graisse de canard",2,"c.à.s",EP)],etapes:["Réchauffer les cuisses de canard confites au four ou à la poêle jusqu'à peau croustillante.","Couper les pommes de terre en rondelles, les cuire dans la graisse de canard 20 min.","Ajouter l'ail et le persil ciselés en fin de cuisson.","Servir les pommes de terre avec le confit."]},
{nom:"Far breton",cat:'Dessert',portions:6,temps:50,cuisine:'Française',saison:["Automne","Hiver"],difficulte:'Moyen',ingredients:[ing("Pruneaux",150,"g",EP),ing("Farine",150,"g",EP),ing("Œufs",4,"pièces",CR),ing("Lait",50,"cl",CR),ing("Sucre",120,"g",EP)],etapes:["Préchauffer le four à 180°C. Répartir les pruneaux dans un plat beurré.","Fouetter les œufs et le sucre, ajouter la farine puis le lait progressivement.","Verser la pâte sur les pruneaux.","Enfourner 40 min jusqu'à ce que le far soit doré et pris."]},
{nom:"Clafoutis aux cerises",cat:'Dessert',portions:6,temps:45,cuisine:'Française',saison:["Été"],difficulte:'Moyen',ingredients:[ing("Cerises",500,"g",FL),ing("Farine",100,"g",EP),ing("Œufs",3,"pièces",CR),ing("Lait",30,"cl",CR),ing("Sucre",100,"g",EP)],etapes:["Préchauffer le four à 180°C. Disposer les cerises dénoyautées dans un plat beurré.","Fouetter les œufs et le sucre, ajouter la farine puis le lait.","Verser la pâte sur les cerises.","Enfourner 35 à 40 min jusqu'à ce que le clafoutis soit doré."]},
{nom:"Île flottante",cat:'Dessert',portions:4,temps:30,cuisine:'Française',saison:["Toute saison"],difficulte:'Difficile',ingredients:[ing("Œufs",4,"pièces",CR),ing("Sucre",100,"g",EP),ing("Lait",50,"cl",CR),ing("Vanille",1,"gousse",EP)],etapes:["Séparer les blancs des jaunes. Monter les blancs en neige avec la moitié du sucre.","Pocher les blancs par cuillerées dans l'eau frémissante 2 min de chaque côté, égoutter.","Faire chauffer le lait avec la vanille, fouetter les jaunes avec le reste de sucre puis verser le lait chaud dessus.","Cuire la crème anglaise à feu doux en remuant jusqu'à nappage, laisser refroidir et servir avec les blancs."]},
